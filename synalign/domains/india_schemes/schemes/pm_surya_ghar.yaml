  checked_on: '2026-10-03'
  method: Written from official pages by one research agent; every fact, rule number and Hindi name re-checked against official pages by a second agent; disagreements decided by a third.
  notes:
  - 'Writer: The scheme was approved on 29 Feb 2024 with a total budget of Rs 75,021 crore. Its guidelines set it to run until 31 March 2027, so it should still be open in October 2026, but it may end or change after that date. The subsidy rates come from the MNRE guidelines of 7 June 2024. The amendment of 7 July 2025 and the clarification of 13 Feb 2025 did not change the rates. The clarification allowed ground-mounted elevated systems, and the amendment removed old Phase II applications that had not been installed by 1 April 2025; those households can apply again under this scheme. The guidelines say the benchmark cost, and so possibly the subsidy, may be revised at the mid-term review, so check the current rate on pmsuryaghar.gov.in. States may add their own subsidy on top of the central amount. The 300 units of free electricity is a target that depends on system size and use; it is not a fixed cash benefit. The low-interest loan is described as planned, and the actual terms vary by
    bank. The pmsuryaghar.gov.in portal could not be read by the fetcher because it loads its content with scripts, so these facts come from the MNRE guideline PDFs. The Hindi name was taken from the bilingual MNRE home page.'
  - No independent check was returned for this scheme.
