id: pmmy
name: Pradhan Mantri MUDRA Yojana
short_name: PMMY
names_hi:
- प्रधानमंत्री मुद्रा योजना
- पीएमएमवाई)
aliases:
- MUDRA loan
- mudra yojana
- pradhan mantri mudra yojana
- PM mudra loan
- shishu kishore tarun loan
level: central
state: ''
ministry: Ministry of Finance, Department of Financial Services
category: credit_enterprise
summary: 'Loans without collateral for micro enterprises doing non-farm business, or allied activities such as poultry, dairy and beekeeping. Banks, NBFCs and microfinance institutions give the loans in four categories: Shishu (up to Rs 50,000), Kishore (up to Rs 5 lakh), Tarun (up to Rs 10 lakh) and Tarun Plus (up to Rs 20 lakh, for those who repaid a Tarun loan).'
sections:
  eligibility:
  - Meant for micro enterprises (small businesses) that need institutional credit.
  - The loan must be for a non-agricultural activity; allied activities such as poultry, dairy and beekeeping are also covered.
  - The loan can be for a term loan, working capital, or both.
  - Tarun Plus loans (above Rs 10 lakh) are only for entrepreneurs who took and fully repaid an earlier loan under the Tarun category.
  exclusions:
  - Farming itself is not covered; the loan is for non-agricultural purposes and allied activities only.
  benefits:
  - 'Shishu: loan of up to Rs 50,000.'
  - 'Kishore: loan above Rs 50,000 and up to Rs 5 lakh.'
  - 'Tarun: loan above Rs 5 lakh and up to Rs 10 lakh.'
  - 'Tarun Plus: loan above Rs 10 lakh and up to Rs 20 lakh, available from 24 October 2024 to those who repaid an earlier Tarun loan.'
  - No collateral (security) is required.
  how_to_apply:
  - 'Apply at a member lending institution: a public sector bank, private sector bank, foreign bank, Regional Rural Bank, Small Finance Bank, NBFC, or microfinance institution (MFI or NBFC-MFI).'
  documents: []
