  method: Written from official pages by one research agent; every fact, rule number and Hindi name re-checked against official pages by a second agent; disagreements decided by a third.
  notes:
  - 'Writer: All figures come from the Department of Financial Services page (its progress figures are dated 28.02.2025). The official MUDRA site (mudra.org.in) failed a certificate check and could not be opened, so detailed borrower eligibility, the documents list and interest rates could not be confirmed from an official page; the DFS page does not state an interest rate, which is set by the lending institution. Tarun Plus (above Rs 10 lakh up to Rs 20 lakh) applies from 24.10.2024 only to those who repaid a Tarun loan. No official Hindi name was found on the page opened. Note: holding an unpaid MUDRA loan can affect eligibility for PM Vishwakarma.'
  - 'Checker: PIB describes the loans as being for non-corporate, non-farm income-generating activities in manufacturing, trading and services. The record never says ''non-corporate''.'
  - 'Checker: Interest rate: PIB says it is governed by RBI guidelines and has flexible repayment terms. The record correctly says the lender sets the rate.'
  - 'Checker: The scheme is still running. The PIB release of 8 Apr 2026 marks 11 years, and the Finance Minister says it will continue. DFS progress figures (28.02.2025) are superseded by PIB figures as on 27.03.2026: 57.79 crore loans, Rs 40.07 lakh crore.'
  - 'Checker: The documents list is empty.'
  - 'Checker: No official Hindi name is in the record, though one exists (see names_hi).'
  - Official Hindi name added from https://www.pib.gov.in/PressReleasePage.aspx?PRID=2249938&reg=48&lang=2.
