review:
  status: verified
  checked_on: '2026-10-03'
  method: Written from official pages by one research agent; every fact, rule number and Hindi name re-checked against official pages by a second agent; disagreements decided by a third.
  notes:
  - 'Writer: The scheme was launched in June 2020, first for lending up to 31 March 2022, then extended to 31 December 2024. The restructured scheme extends the lending period to 31 March 2030, with interest subsidy and cashback paid until 31 March 2033. Loan amounts went up from Rs 10,000 / Rs 20,000 / Rs 50,000 to Rs 15,000 / Rs 25,000 / Rs 50,000. The 2020 FAQ PDFs still on the portal show the old Rs 10,000 limit, a March 2022 end date, an older cashback of Rs 50-100 a month and the 24 March 2020 vending cut-off; these are out of date. The interest rate itself is set by each lender''s policy or RBI norms; the 7% subsidy reduces it. The scheme now covers census towns and peri-urban areas step by step, so availability there may vary. I could not open PIB or myScheme.'
  - 'Checker: Source 5 (the Hindi FAQ PDF) is the outdated 2020 FAQ. It gives a Rs 10,000 loan, a scheme period to March 2022, the 24 March 2020 vending cut-off and old cashback of Rs 50-100 a month. Use it only for the Hindi scheme name, never for facts. The writer flagged this.'
  - 'Checker: Missing condition: coverage is limited to States/UTs that have notified rules and schemes under the Street Vendors Act, 2014 (Scheme Guidelines para 3). Census towns and peri-urban areas are being added step by step.'
  - 'Checker: Missing condition: interest subsidy is paid only for months in which the loan account is ''standard'' (not NPA) on the claim dates.'
  - 'Checker: Minimum loan amounts per tranche (Rs 5,000 / Rs 15,000 / Rs 30,000) are not mentioned. This is minor, but useful for ''how much can I get'' answers.'
  - 'Checker: The 3rd-tranche processing fee follows the lender''s policy. The record implies this by naming only the 1st and 2nd loans, but it could say so plainly.'
  - 'Checker: All sources are official MoHUA portal files. Wording is paraphrased; I saw no copied sentences.'
