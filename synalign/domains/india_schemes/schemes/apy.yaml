review:
  status: verified
  checked_on: '2026-10-03'
  method: Written from official pages by one research agent; every fact, rule number and Hindi name re-checked against official pages by a second agent; disagreements decided by a third.
  notes:
  - 'Writer: New subscribers can still join. On 21 January 2026 the Union Cabinet approved continuing APY up to 2030-31, according to a PFRDA notice that also reported over 8.66 crore subscribers. The government co-contribution (50% of the contribution or Rs 1,000 a year, whichever was lower, for 5 years) applied only to people who joined between 1 June 2015 and 31 March 2016. It is no longer offered. Official pages word the age limit slightly differently: the PFRDA FAQ says you can join up to and including your 40th birthday, while the DFS FAQ says 18 years to 39 years 364 days. The rules here use 39 as the last full year of age, but a person can still join on their 40th birthday itself. Official pages also disagree on early exit: the PFRDA FAQ allows leaving before 60 by choice (you get back your own contributions plus earnings), while a 2025 PIB backgrounder says exit before 60 is only on death or terminal illness. The commonly quoted amounts returned to the nominee (Rs 1.7 lakh to Rs
    8.5 lakh) and the full contribution table for every age and slab could not be confirmed on an official page that loaded, so they are left out. The Hindi name comes from the DFS page.'
  - 'Checker: Documents list is incomplete. The PFRDA APY brochure says nominee and spouse details are both mandatory when opening the account, but the record lists only nominee details as mandatory.'
  - 'Checker: Hindi-name provenance is wrong. The status note says the name came from the DFS page, but the DFS English page has no Devanagari scheme name. Cite the PFRDA Hindi page (pfrda.org.in/hi/web/pfrda/schemes/atal-pension-yojana-apy) or the Gazette instead.'
  - 'Checker: Early-exit rules may change. A Gazette notification of 18 Aug 2025 (published 27 Aug 2025) added para 14 to the APY notification, saying PFRDA will set the detailed exit modalities. Recheck the exit statements against any later PFRDA circular. The 2015 Gazette para 13 itself allows voluntary exit before 60 with a refund of own contributions plus net interest; only the government co-contribution is forfeited. The NPS Trust About APY page says exit before 60 is allowed only on death or terminal disease, so official pages still conflict.'
  - 'Checker: Exclusion wording: the ''no penalty'' part is the writer''s inference and is not in the 10 Aug 2022 Gazette. Say only that the account is closed and the savings are returned.'
  - 'Checker: The contribution fact cites the PIB 2025 backgrounder (source 3), which itself footnotes a non-official site (atalpensionyojana.in). Cite the 2015 Gazette Annex-1 on the PFRDA site instead.'
  - 'Checker: The status note says the full contribution table could not be found on an official page. It is in the 2015 Gazette Annex-1 on the PFRDA site.'
  - 'Checker: Tax benefit is not mentioned. PIB 2025 says APY contributions qualify under Section 80CCD of the Income-tax Act (1961 numbering), and this should be checked against the Income-tax Act, 2025.'
  - 'Checker: Minor: eAPY joining through npstrust.org.in/open-apy-account is confirmed by the PFRDA scheme page. Protean''s enps.nsdl.com eAPY link and the APY mobile app are also official routes.'
  - 'Checker on the status note: Gazette Annex-1 gives the indicative corpus returned to the nominee as Rs 1.7, 3.4, 5.1, 6.8 and 8.5 lakh for the Rs 1,000 to Rs 5,000 slabs. The full table of monthly, quarterly and half-yearly contributions for ages 18 to 40 is in the same annex.'
