review:
  status: verified
  checked_on: '2026-10-03'
  method: Written from official pages by one research agent; every fact, rule number and Hindi name re-checked against official pages by a second agent; disagreements decided by a third.
  notes:
  - 'Writer: The scheme guidelines (sent to states in August 2022) approve it for the 15th Finance Commission period, 2021-22 to 2025-26. I could not open an official page confirming the period after March 2026. The scheme is clearly still running, though: the ministry page lists food grain allocation letters for 2025-2026 and newer circulars. The June 2024 revision changed only Poshan Tracker equipment and staff travel, not what beneficiaries get. The guidelines say the nutrition norms are under revision, so the calorie and protein figures may have changed. The guidelines set cost norms per beneficiary per day: Rs 8 for a child, Rs 12 for a severely malnourished child, and Rs 9.50 for pregnant women, breastfeeding mothers and adolescent girls. This is what the government spends on food, not cash paid to families, and it may have been revised. Each state chooses its own menu and take-home ration products. Newer circulars may have added steps on Poshan Tracker (for example a nominee module
    and APAAR ID), so ask the local Anganwadi worker about the current procedure. Under the National Food Security Act 2013, pregnant women, mothers up to 6 months after birth, and children aged 6 months to 6 years have a legal right to this food. No age or income rule is set, because the beneficiaries are children and women of all ages and there is no income test.'
  - 'Checker: Aadhaar and face-recognition rules are out of date. A WCD circular dated 30.05.2025 (https://wcd.gov.in/documents/uploaded/1748855151_DSe2Tlw651.pdf) made face recognition (FRS) mandatory for take-home ration distribution from 01.07.2025 and added FRS at registration from 01.08.2025. Pregnant women, breastfeeding mothers and adolescent girls must now register with their own Aadhaar through e-KYC plus face recognition. Children 0-6 are registered with the Aadhaar of the mother, father or guardian plus face recognition. Beneficiaries can also do the photo capture and e-KYC themselves through the Poshan Tracker citizen module. The record''s how_to_apply and documents sections leave all of this out. Saying only that a child can use ''the mother''s Aadhaar'', or that someone without Aadhaar will be helped to get one, may mislead users about what they need now.'
  - 'Checker: The adolescent-girl coverage area is ambiguous. The guidelines'' ''Aspirational Districts of States including Assam and North-Eastern States'' could mean only aspirational districts. The record states that all of Assam and the North-East is covered, which follows the WCD page''s wording (''Aspirational Districts and North-Eastern Regions'') but is not certain.'
  - 'Checker: The rule that people staying only temporarily can register applies, in the guidelines, to pregnant women, breastfeeding mothers and children up to 6. The record says ''families'', which is broader.'
  - 'Checker: Sources are official (wcd.gov.in). I found no copied sentences.'
