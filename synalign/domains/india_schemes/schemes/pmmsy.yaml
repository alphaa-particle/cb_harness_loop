review:
  status: verified
  checked_on: '2026-10-03'
  method: Written from official pages by one research agent; every fact, rule number and Hindi name re-checked against official pages by a second agent; disagreements decided by a third.
  notes:
  - 'Writer: The national operational guidelines (June 2020) set the scheme period as FY 2020-21 to 2024-25, with a total investment of Rs 20,050 crore. I could not open an official page (dof.gov.in returned 403 and pmmsy.dof.gov.in did not render) to confirm whether PMMSY has been extended beyond 2024-25 or replaced, so citizens should ask their district fisheries office whether new applications are being taken in 2026. Unit cost ceilings vary by activity and region; the J&K document shows higher Himalayan ceilings (for example Rs 8.40 lakh per hectare for a new carp pond), which are not the national figures. Funding for the livelihood support is split 50:50 between Centre and State in general States, 80:20 in North-Eastern and Himalayan States and 100% Centre in UTs; the fisher''s own Rs 1,500 share is the same everywhere. The accident insurance amounts come from the J&K State document. States may add their own top-up assistance. The official Hindi name was not seen on an official page,
    so names_hi is left empty.'
  - 'Checker: The summary says the original period was 2020-21 to 2024-25 and asks users to check whether the scheme is still open. This is misleading. The PIB reply of 22 Jul 2026 (PRID 2287585) refers to approvals during 2020-21 to 2026-27. PIB of 10 Mar 2026 (PRID 2237418) shows Rs 2,500 crore in the 2026-27 budget. PIB of 11 Aug 2026 (PRID 2297721) reports insurance releases and fishing-ban support in 2026-27. I did not see the formal extension or 16th Finance Commission approval order.'
  - 'Checker: The accidental hospitalisation cover is wrong: Rs 25,000 per the central PIB reply, not Rs 20,000. The accident insurance figures should be sourced from the central PIB or DoF, not the J&K document.'
  - 'Checker: names_hi is empty, but the Department of Fisheries PMMSY page shows प्रधानमंत्री मत्स्य संपदा योजना.'
  - 'Checker: The current outlay is Rs 20,750 crore (PIB, Mar 2026), not Rs 20,050 crore.'
  - 'Checker: dof.gov.in lists a document called ''Revisions in the Operational Guidelines of PMMSY'' that I could not open (it returned 403 and then offered a file download). Some figures from the June 2020 guidelines may have been revised.'
  - 'Checker: Sources 2 and 3 are State government sites (J&K, Goa). The national guidelines are hosted on dof.gov.in and should be cited there.'
  - 'Checker: The myScheme PMMSY page still says the scheme runs 2020-21 to 2024-25, so that official page is stale.'
  - 'Checker: Beneficiary selection and approval are done by States/UTs (PIB, Jul 2026). Users should apply through the district fisheries officer, as the record says.'
  - 'Checker: Process note: opening the DoF revisions PDF in the browser pane brought up a file-save dialog, which I did not complete. The WebFetch tool also automatically cached copies of the guideline PDFs it fetched in the session''s tool-results folder. I did not write or edit any project files.'
  - Official Hindi name added from https://www.dof.gov.in/offerings/schemes-and-services/details/pmmsy-whats-new-ADO4ATMtQWa.
  - 'Statement to correct: ''Accident insurance for fishers with the full premium paid by government: Rs 5 lakh ... Rs 2.5 lakh ... Rs 20,000 for accidental hospitalisation''. The checker read ''Rs 5 lakh death or permanent total disability; Rs 2.5 lakh permanent partial disability; Rs 25,000 accidental hospitalisation'' on https://pib.gov.in/PressReleasePage.aspx?PRID=2241147.'
  - '2026-10-03: the checker''s corrections above were applied to the statements; re-read the official page before relying on them.'
