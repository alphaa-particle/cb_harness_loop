review:
  status: needs_review
  checked_on: '2026-10-03'
  method: Written from official pages by one research agent; every fact, rule number and Hindi name re-checked against official pages by a second agent; disagreements decided by a third.
  notes:
  - 'Writer: The official site gives two different amounts. The PMUY home page shows Rs 2,050 for a 14.2 kg connection and Rs 1,300 for a 5 kg connection, with an item-wise break-up that adds up to those totals. The older About page still shows Rs 1,600 and Rs 1,150. This record uses the home page figures. The home page counter showed 10,56,85,306 connections released as of 23 Sep 2026, so connections were still being given out. Whether a new application is approved depends on the current target given to oil companies, so applicants should check with their LPG distributor. Separately, the Union Cabinet has approved a per-refill subsidy for PMUY consumers in recent years (reported as Rs 300 per 14.2 kg cylinder for a limited number of refills a year). PIB and the Petroleum Ministry website could not be opened, so the current amount and refill limit were not checked and are left out of this record. The 14 points of the deprivation declaration were not available on the pages that could be opened.
    No official Hindi name was found on the pages opened.'
  - No independent check was returned for this scheme.
