review:
  status: verified
  checked_on: '2026-10-03'
  method: Written from official pages by one research agent; every fact, rule number and Hindi name re-checked against official pages by a second agent; disagreements decided by a third.
  notes:
  - 'Writer: The scheme is open. Eligibility and most benefit details come from PIB''s January 2022 FAQ, which follows the original guidelines. The Ministry has since brought in revised ''DDU-GKY 2.0'' guidelines (a draft SOP dated June 2025 is online), and states were inviting DDU-GKY 2.0 project proposals in 2026. The final 2.0 guidelines could not be opened, and ddugky.gov.in and kaushalpanjee.nic.in did not load. Under the 2.0 draft procedures, post-placement support is Rs 1,270 a month for 6 months. The older rule was Rs 1,000 a month for 2, 3 or 6 months, depending on whether the job is in the home district, the home state or outside it. A placement must also last at least 6 months, and minimum salaries are tied to state minimum wages. The older Rs 6,000 a month salary floor and the Rs 100 per training day meal and travel allowance for non-residential courses may no longer apply. Check the current amounts with your State Rural Livelihood Mission. Reserved shares (SC/ST, minorities,
    women 33%, persons with disabilities) differ between documents and states. rules.age_max is set to 45, but that limit applies only to women and the listed special groups; for everyone else the upper limit is 35.'
  - 'Checker: The core facts come from a January 2022 PIB FAQ based on the original guidelines. The final DDU-GKY 2.0 guidelines and SOP (which CGSRLM''s 2026 EOI says are on kaushal.rural.gov.in) could not be read. The opened 2.0 SOP is only a draft (June 2025), so the age range, allowances and PPS under 2.0 are not finally confirmed.'
  - 'Checker: rules.age_max = 45 is unsafe as a flat rule. The general upper limit is 35, and 45 applies only to women and listed special groups.'
  - 'Checker: The ''Kaushal Panjee'' application route may be out of date. DDU-GKY 2.0 runs on a new MoRD ''Unified IT Platform for DDUGKY and RSETI'' (kaushal.rural.gov.in). I could not confirm how candidates now register.'
  - 'Checker: The summary claims the scheme has run under 2.0 rules ''since 2025-26'', but no official page confirms that date. Official evidence only shows a draft SOP (June 2025) and 2.0 project calls for FY 2026-28 (Chhattisgarh EOI, PAC meeting on 02.07.2026).'
  - 'Checker: Reservation shares conflict between official pages. PIB FAQ: SC/ST 50%, minority 15%, women 33%, PwD 3%. Uttarakhand RD: SC 19%, ST 3%, minorities 10%, women 33%, PwD 5%. Do not state them as facts.'
  - 'Checker: The Hindi name spelling is not verified against a central source, and a state SRLM uses ''दीनदयाल उपाध्याय-ग्रामीण कौशल योजना''.'
  - 'Checker: Old minimum-salary figures (Rs 6,000/month; Rs 10,000/12,000 or minimum wage in 2.0 draft for captive employers) differ by version. The record rightly avoids giving one figure.'
  - 'Checker: Still open: the Chhattisgarh SRLM held a DDU-GKY PAC meeting on 02.07.2026 and its 2.0 EOI requires training to start by 31.10.2026.'
  - 'Rule age_max=45 removed: the checker read ''35 for general candidates; 45 only for women, PVTGs, PwDs, transgender persons and the listed special groups'' on https://static.pib.gov.in/WriteReadData/specificdocs/documents/2022/jan/doc2022163601.pdf.'
  - Hindi name not confirmed on an official page; kept only as a search alias.
  - '2026-10-03: the checker''s corrections above were applied to the statements; re-read the official page before relying on them.'
