review:
  status: needs_review
  checked_on: '2026-10-03'
  method: Written from official pages by one research agent; every fact, rule number and Hindi name re-checked against official pages by a second agent; disagreements decided by a third.
  notes:
  - 'Writer: The scheme is running and new applications are accepted through the states. The central amounts of Rs 200 (age 60 to 79) and Rs 500 (age 80 and above) shown on the NSAP portal in 2026 are the same as in the October 2014 guidelines. What a pensioner actually receives depends heavily on the state top-up. The NSAP FAQ, which may be out of date, says the total ranges from Rs 200 to Rs 1,000 a month across states. Whether a new name is added also depends on the state''s BPL list and the number of central pensions given to the state; states may pay extra pensions from their own funds. The NSAP site lists a notification under the Aadhaar Act, 2016, so Aadhaar (or proof of enrolment) is likely required, but that notification was not opened. The old address nsap.nic.in no longer works; the portal is now nsap.dord.gov.in. The scheme replaced the 1995 National Old Age Pension Scheme in 2007, which lowered the age from 65 to 60 and changed the condition from ''destitute'' to ''BPL''. No
    official Hindi name was found on the pages opened.'
  - No independent check was returned for this scheme.
