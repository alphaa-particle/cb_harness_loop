review:
  status: verified
  checked_on: '2026-10-03'
  method: Written from official pages by one research agent; every fact, rule number and Hindi name re-checked against official pages by a second agent; disagreements decided by a third.
  notes:
  - 'Writer: The Act came into force in all rural areas on 1 July 2026, and MGNREGA was repealed from the same date. Ongoing MGNREGA works continue under the new Act. Each State must notify its own scheme within six months of commencement, so local procedures may differ by State. The definition of ''adult'' (completed 18 years) was taken from Section 2 as quoted in the Jammu and Kashmir scheme notification; the central Act text on indiacode.nic.in returned 403. Wage rates differ by State and are notified by the Central Government. Until new rates were notified, MGNREGA rates applied. A 30 June 2026 notification of new State-wise rates (reported elsewhere with a Rs 300 per day floor) could not be opened on an official page (egazette.gov.in failed its certificate check), so no wage amount is stated here. Funding is shared 60:40 between Centre and States (90:10 for North Eastern and Himalayan States; 100% central for UTs without a legislature). The 15-day wage-payment and delay-compensation
    rules are as stated in the PIB backgrounder and FAQ; the exact day from which compensation starts is described there as beyond the sixteenth day after the muster roll closes.'
  - 'Checker: The status_note mentions a Rs 300 per day wage floor ''reported elsewhere'', which is non-official reporting. It is rightly kept out of the facts, but it should be removed from the corpus so it cannot be retrieved. FAQ Q-19 says MGNREGA wage rates apply until new rates are notified under Section 10.'
  - 'Checker: The aliases MGNREGA, NREGA and ''manrega yojana'' point to this scheme. That is fine for search, but every answer must say MGNREGA was repealed on 1 July 2026 and replaced by this Act. It should not be described as still running.'
  - 'Checker: The age-18 definition comes from the J&K UT scheme notification, which says terms follow Section 2 of the Act. The central Act text was not opened.'
  - 'Checker: The fact statement ''beyond 15 days'' simplifies the official wording, under which compensation runs for each day of delay beyond the 16th day after the muster roll closes.'
  - 'Checker: Missing worker-facing point: during the State-notified peak-season pause of up to 60 days in total, no work is offered, so someone asking for work then may be told to wait.'
  - 'Checker: Missing: ex-gratia for death or permanent disability at a worksite follows PMSBY provisions (PIB backgrounder, May 2026).'
  - 'Checker: Local procedures and wage rates vary by State, because each State notifies its own scheme. The record says this only in status_note.'
