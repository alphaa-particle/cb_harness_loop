review:
  status: verified
  checked_on: '2026-10-03'
  method: Written from official pages by one research agent; every fact, rule number and Hindi name re-checked against official pages by a second agent; disagreements decided by a third.
  notes:
  - 'Writer: The revised scheme (dated 26 September 2024) was approved for the 15th Finance Commission period, 1 April 2022 to 31 March 2026. None of the pages I read confirmed that it continues after March 2026, though the ARJUN portal and ALIMCO pages still show it as active. The scheme gives two money rules: an income rule (full cost up to Rs 22,500 a month; 50% from Rs 22,501 to Rs 30,000) and a ceiling based on what the aid costs (full help up to Rs 15,000; up to Rs 15,000 for aids costing Rs 15,001 to Rs 30,000). The guidelines do not clearly say how the two rules combine. School children are also covered through ADIP-SSA (Samagra Shiksha) with relaxed rules, for example a joint certificate when disability is below 40%, and a motorised tricycle at 40% disability for students in Classes IX to XII aged 16 or above. The myScheme page would not load.'
  - Whether the scheme is still open to new applicants was not clear.
  - 'Checker: Status: DEPwD''s own ADIP page (https://depwd.gov.in/adip/) says the scheme was approved for the rest of the 15th Finance Commission period, i.e. up to 31.3.2026. I found no official continuation order for 2026-27 or the 16th FC period on the DEPwD homepage, ADIP page or What''s New page. The ARJUN portal and myScheme pages did not render. So still_open is ''unclear''. The record should not promise availability without this caveat.'
  - 'Checker: The repeat_gap fact/question (''after how many years can I get the same aid again'' -> 3 years) is wrong for children under 18: custom items such as orthosis, prosthesis and learning material can be given again after 1 year. It is also wrong for motorised tricycles/wheelchairs and smartphones, which are once in 5 years.'
  - 'Checker: The income rule (full cost up to Rs 22,500; 50% to Rs 30,000) and the cost-ceiling rule (help capped at Rs 15,000 for aids costing Rs 15,001-30,000) both appear in the scheme. A chatbot must not say ''full cost'' for an aid costing more than Rs 15,000.'
  - 'Checker: The cochlear implant benefit leaves out that the same income-based full/50% split applies (Appendix-I).'
  - 'Checker: Missing detail: people in orphanages, half-way homes, special schools or special homes, whose income is certified by the District Collector or head of the institution, get aids only through ALIMCO/NIs/CRCs (para 6.0 Note b).'
  - 'Checker: The exclusion ''below 40%'' leaves out two more exceptions: children up to 18 in special schools, home schooling or walk-in, on a committee''s recommendation; and amputees without a certificate, who can get a high-end prosthesis.'
  - 'Checker: Source 4 is labelled ''ALIMCO Hindi page (एडिप योजना)'', but its URL (alimco.in/hi/RVY) serves ALIMCO''s Hindi homepage, which mentions both ADIP and RVY. The name is confirmed there, but the label is misleading.'
  - 'Checker: All sources are official (depwd.gov.in, s3waas.gov.in hosting the DEPwD OM, alimco.in). I saw no copied sentences; the wording is paraphrased.'
