review:
  status: verified
  checked_on: '2026-10-03'
  method: Written from official pages by one research agent; every fact, rule number and Hindi name re-checked against official pages by a second agent; disagreements decided by a third.
  notes:
  - 'Writer: The scheme is open for new deposits. No interest rate is given in this record. The Ministry of Finance resets the rate every quarter, and the rate for October-December 2026 could not be confirmed on any official page that loaded: the India Post site was unavailable, and the latest DEA rate order found (30 September 2025) is a scanned PDF. Check the current rate at the post office or bank. The NSI copy of the 2019 rules says two things that may be out of date. It says retirees aged 55 to 60 must open the account within one month of getting their retirement benefits, and it says an account can be extended only once. NSI''s scheme summary, however, says an account can be extended any number of times in blocks of 3 years. Later amendments may have changed both points, so confirm them locally. Because of this conflict, the age_min rule is set to 50, the lowest joining age (for retired defence personnel); the general age is 60. The Section 80C deduction is as stated by NSI. The tax
    position may differ under the new tax regime and the Income-tax Act, 2025. No official Hindi name was found on a page that loaded.'
  - 'Checker: Outdated rule: the retiree window for ages 55 to 60 is now 3 months, not one month. India Post cites the SCSS Amendment Scheme 2023 (SB Order 06/2023) and the Fourth Amendment 2023 (SB Order 22/2023). Both points the status note flagged as possibly outdated were in fact changed.'
  - 'Checker: Outdated exclusion: the record says the legal heir of an employee who died in service cannot deposit terminal benefits. India Post now lets the spouse of a government employee who died in service at 50 or older open an account, and retirement benefits now cover benefits of an employee who died in service.'
  - 'Checker: Documents list is incomplete. India Post requires the account opening form, a KYC form, PAN and Aadhaar (or the listed alternatives: passport, driving licence, voter ID, NREGA job card, NPR letter), and proof of the source of funds for investments over Rs 10 lakh. A nomination is mandatory when opening.'
  - 'Checker: Missing detail: after the account holder dies, the account earns only Post Office savings-account interest from the next day until it is closed. The record says only that the deposit with interest goes to the nominee or legal heirs.'
  - 'Checker: Missing detail: TDS applies above the prescribed interest limit unless Form 15G or 15H is submitted, and quarterly interest that is not claimed earns no further interest.'
  - 'Checker: All three cited sources are NSI pages (nsiindia.gov.in), which fail certificate checks and could not be opened, and the record relies on the unamended 2019 rules text. Use the India Post SCSS page and the 2023 amendment SB Orders as sources instead.'
  - 'Checker: Not verified on any opened page: ''only the first holder''s age counts in a joint account'', ''a spouse who is joint holder or sole nominee can continue the account'', ''cannot deposit more than the retirement benefits'', and ''Form-1''. India Post confirms only that the whole deposit in a joint account belongs to the first holder.'
  - Official Hindi name added from https://www.indiapost.gov.in/banking-services/savings.
  - 'Statement to correct: ''Aged 55 or more but below 60 and retired ... only within one month of receiving your retirement benefits''. The checker read ''Within 3 months of receiving the retirement benefits. Proof of the payout date and an employer certificate must be attached.'' on https://www.indiapost.gov.in/banking-services/savings.'
  - 'Statement to correct: ''People below 55 cannot open an account, except retired defence personnel aged 50 or more''. The checker read ''There is a second exception. The spouse of a government employee (Central or State) who died in service after reaching 50 may also open an account, subject to the other conditions (SB Order 22/2023).'' on https://www.indiapost.gov.in/banking-services/savings.'
  - 'Checker on the status note: 8.2% a year for 01.10.2026 to 31.12.2026. India Post shows quarterly interest of Rs 205 per Rs 10,000.'
  - '2026-10-03: the checker''s corrections above were applied to the statements; re-read the official page before relying on them.'
