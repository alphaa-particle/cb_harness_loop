review:
  status: verified
  checked_on: '2026-10-03'
  method: Written from official pages by one research agent; every fact, rule number and Hindi name re-checked against official pages by a second agent; disagreements decided by a third.
  notes:
  - 'Writer: The rules changed in 2026. The NPS Vatsalya Scheme Guidelines 2025 (PFRDA circular of 7 January 2026, in force from 23 February 2026) replaced the rules of 18 September 2024. The old rules set a minimum of Rs 1,000 a year, allowed up to 3 partial withdrawals before 18, and allowed a full lump-sum exit at 18 only if the total was Rs 2.5 lakh or less. PFRDA''s FAQ page still shows those old figures, so this record follows the 2025 Guidelines and the current scheme page. The FAQ also says the minor must be an Indian citizen, while the 2025 Guidelines say NRIs and OCIs under 18 can join. PFRDA''s scheme page adds two points: later contributions can be as small as Rs 10, and under the old tax regime contributions get a deduction of up to Rs 50,000. Tax treatment should be rechecked under the Income-tax Act, 2025. Returns are market-linked and not guaranteed. The scheme is open for new accounts. No official Hindi name was found.'
  - 'Checker: An official Hindi name exists: ''एनपीएस वात्सल्य योजना'' appears in PFRDA''s Hindi circular of 27 Feb 2026. Add it to names_hi and correct the status note.'
  - 'Checker: The equity statement is incomplete and could mislead about risk. The current PFRDA scheme page lets pension funds design their own NPS Vatsalya allocation with up to 100% in equity, or follow an indicative pattern capped at 75% equity. The Guidelines'' para 12 is to be read with circular PFRDA/2026/09/REG-PF/03 of 23 Feb 2026.'
  - 'Checker: Missing condition: for a partial withdrawal or exit at 18, a bank account of the minor, or a joint account with the minor, is required (Guidelines para 7(vi)). The record mentions a bank account only for NRI/OCI children.'
  - 'Checker: Missing condition: if fresh KYC is not done after 18, no transactions are allowed until 21, after which the account becomes dormant (Guidelines para 7(iii)). Para 13.2(iv) separately describes moving to a higher-equity scheme at 21. The two clauses sit side by side and should both be reflected.'
  - 'Checker: The scheme-page URL cited as source 1 (pfrda.org.in/web/pfrda/schemes/nps-vatsalya) now redirects to /web/pfrda/schemes/national-pension-system/nps-vatsalya. Update the link.'
  - 'Checker: The 80% lump-sum option is described without its condition. The scheme page applies it when the corpus is Rs 8 lakh or more, with at least 20% going into an annuity.'
  - Official Hindi name added from https://pfrda.org.in/documents/33652/153574/Circular+NPS+Vatsalya+Scheme+Guidelines+2025+effective+from+23rd+Feb+2026.pdf.
