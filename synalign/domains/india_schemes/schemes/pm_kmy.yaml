review:
  status: verified
  checked_on: '2026-10-03'
  method: Written from official pages by one research agent; every fact, rule number and Hindi name re-checked against official pages by a second agent; disagreements decided by a third.
  notes:
  - 'Writer: The scheme is still open for enrolment. The 2024-25 Annual Report and the 2024 PIB backgrounder describe enrolment at CSCs, and the PIB note says 23.38 lakh farmers had joined by 6 August 2024. The land-record date of 01.08.2019 comes from the PIB backgrounder and the Annual Report, not from the operational guidelines. Farmers who got land after that date should check whether they qualify. The guidelines say the CSC charges Rs 30 for each enrolment and the Department pays it back, so the farmer pays only the first contribution. The exit rules (before and after 10 years) are taken from the PIB backgrounder. If a member later becomes ineligible, the government''s matching share stops, but the member may keep paying. pmkmy.gov.in failed a certificate check, so the guidelines were read from fw.pmkisan.gov.in.'
  - 'Checker: Still open: the newest official page I could read is the DA&FW Annual Report 2024-25, published May 2025, which describes ongoing CSC enrolment. The PIB backgrounder is from Sept 2024. I found no closure notice. The English 2025-26 Annual Report exists but is over 10 MB and could not be fetched. Treat ''open'' as very likely but not confirmed on a 2026 page.'
  - 'Checker: pmkmy.gov.in currently fails the certificate check: it presents a csccloud.in certificate. The chatbot should not send users to that URL as their main route. The CSC visit is the route confirmed officially.'
  - 'Checker: The guidelines also say the CSC fee of Rs 30 is paid back to the CSC by DA&FW. The Annual Report 2024-25 says registration is completely free apart from the first contribution. The record agrees with this.'
  - 'Checker: Minor: the record says contributions are monthly. The guidelines (para 6(ix)) also allow quarterly, 4-monthly or half-yearly payment.'
  - 'Checker: Minor: the documents list says the mobile number is optional, while the Annual Report 2024-25 asks farmers to bring one for OTP. The guidelines list it as optional, so the record is acceptable.'
