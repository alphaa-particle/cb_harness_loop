  checked_on: '2026-10-03'
  method: Written from official pages by one research agent; every fact, rule number and Hindi name re-checked against official pages by a second agent; disagreements decided by a third.
  notes:
  - 'Writer: The PM YASASVI guidelines cover 2021-22 to 2025-26. No central page was found that formally extends the scheme beyond March 2026. However, NSP lists the top class school and top class college parts as open for AY 2026-27 (closing 31-10-2026), and West Bengal''s OASIS portal shows OBC post-matric applications open for 2026-27, so the scheme appears to be running. The pre-matric and post-matric parts are run by states on a funds-limited basis: if money runs short, states may select by merit-cum-means and may add their own top-ups. Pre-matric covers government schools only. The top class school rules say household income must be less than Rs 2.5 lakh, while the other parts say up to Rs 2.5 lakh. The YASASVI Entrance Test (YET) held by NTA in 2022 no longer appears active (yet.nta.ac.in did not resolve); selection now uses merit lists. The hostel construction part of the umbrella scheme is not covered in this record. No official Hindi name was found on the pages read.'
  - No independent check was returned for this scheme.
