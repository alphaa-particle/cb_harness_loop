review:
  status: verified
  checked_on: '2026-10-03'
  method: Written from official pages by one research agent; every fact, rule number and Hindi name re-checked against official pages by a second agent; disagreements decided by a third.
  notes:
  - 'Writer: Open for new accounts. The age rule (aged 9 or younger, i.e. under 10) applies to the girl child, not to the parent or guardian who opens the account. The interest rate is revised by the government every quarter: the NSI table shows 8.2% for 01.01.2024 to 30.09.2026, and the rate for October-December 2026 was not yet shown when the page was checked on 2026-10-03. The rules on the NSI site are the 2019 scheme as amended in May 2020; any later amendments (for example on who may act as guardian, or residency rules from the Government Savings Promotion General Rules, 2018) were not checked. The India Post and myScheme pages for this scheme would not load, so all facts come from the National Savings Institute (Ministry of Finance) pages.'
  - 'Checker: Missing key condition: India Post''s SSA eligibility section says the account holder must be a resident citizen of India. The SSA Rules 2016 definition (NSI Id_Pk=177) requires the girl to be a resident Indian citizen at opening and until maturity or closure. India Post also says NRIs are not eligible for small savings accounts. The record never mentions residency.'
  - 'Checker: Missing condition: the twins/triplets exception does not apply to a girl from the second birth if the first birth already gave two or more surviving girls.'
  - 'Checker: Outdated status_note: it says the October-December 2026 rate was not yet published. India Post''s ''Interest Rates (New)'' table (w.e.f. 01.10.2026 to 31.12.2026) shows 8.2% for the Sukanya Samriddhi Account. The NSI table had not been updated beyond 30.09.2026.'
  - 'Checker: Missing: if the girl dies, the account is closed at once using Form-2 with a death certificate, and the balance goes to the guardian.'
  - 'Checker: Conditions missing from the marriage-closure and education-withdrawal statements (listed in the item notes). Without them, readers may think the money is freely available at 18.'
  - 'Checker: Tax caveat (not checked on an official tax page): the Section 80C deduction is usable only by people who choose the old tax regime, and the new regime is now the default. The Income-tax Act, 2025, believed to apply from 1 April 2026, may have renumbered these sections. Check on incometaxindia.gov.in before telling citizens ''Section 80C''.'
  - 'Checker: The writer cited only NSI pages. I cross-checked every number against the separate official India Post SSA page (indiapost.gov.in/banking-services/savings) and found no differences. That India Post page is a better primary source than the old URL that returned 404.'
  - 'Checker: Not checked: the 2024 Ministry of Finance guidelines on irregular small-savings accounts (for example, accounts opened by grandparents who are not natural or legal guardians must move to the natural or legal guardian). These may affect who can be ''guardian''. The writer also flagged this as unchecked.'
