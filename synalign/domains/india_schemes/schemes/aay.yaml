  method: Written from official pages by one research agent; every fact, rule number and Hindi name re-checked against official pages by a second agent; disagreements decided by a third.
  notes:
  - 'Writer: Active. AAY was launched in December 2000 and is now part of the National Food Security Act, 2013. Under PMGKAY the 35 kg is free for five years from 1 January 2024. By calculation that runs to the end of December 2028, but no end date is stated. The 60-year age is only one of several alternative criteria (others include landless labourers, artisans, destitute people and primitive tribal households), so age is not a required condition and no age rule is set. The national ceiling is 2.5 crore families. The latest count on the pages read is old (2.42 crore AAY cards as on 30.09.2014). Because each state has a fixed AAY ceiling, a new family may be added only when a place is free; actual practice, card colour and documents vary by state. The older AAY retail prices in the FAQ (Rs 2 per kg wheat, Rs 3 per kg rice) and the NFSA prices are no longer charged while PMGKAY makes the grain free.'
  - No independent check was returned for this scheme.
