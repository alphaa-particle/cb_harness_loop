  method: Written from official pages by one research agent; every fact, rule number and Hindi name re-checked against official pages by a second agent; disagreements decided by a third.
  notes:
  - 'Writer: The scheme is ongoing. The mission''s own sites (aajeevika.gov.in, nrlm.gov.in) and rural.gov.in could not be loaded, so this record relies on myScheme and the RBI Master Circular of 1 April 2025, the latest DAY-NRLM master circular listed on the RBI site when checked. Interest subvention terms are set again every year. The Rs 3 lakh at 7% figure is for FY 2025-26. The circular also gives a separate subvention for loans above Rs 3 lakh up to Rs 5 lakh, and a 2% prompt-repayment subvention for individual women entrepreneurs on loans up to Rs 1.5 lakh; check the current year''s terms before quoting them. The amount of the Community Investment Fund per SHG was not stated in the pages read, so no figure is given. The Revolving Fund needs the SHG to have existed for 3 or 6 months (''3/6 months'' in the circular); the exact period depends on the state''s norms. The online ''registration'' on myScheme only creates a portal account. In practice a person joins through a local SHG or
    the block SRLM office. Most SHGs are women-only; mixed groups are allowed only for persons with disabilities, elderly people and transgender persons. No official Hindi name was found on a page that could be opened.'
  - No independent check was returned for this scheme.
