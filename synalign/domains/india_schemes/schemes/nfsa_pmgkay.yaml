id: nfsa_pmgkay
name: National Food Security Act, 2013 - Priority Households, with Pradhan Mantri Garib Kalyan Anna Yojana (PMGKAY)
short_name: NFSA / PMGKAY
names_hi:
- प्रधानमंत्री गरीब कल्याण अन्न योजना
- राष्ट्रीय खाद्य सुरक्षा अधिनियम
aliases:
- PMGKAY
