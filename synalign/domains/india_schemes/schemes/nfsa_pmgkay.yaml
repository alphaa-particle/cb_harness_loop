  method: Written from official pages by one research agent; every fact, rule number and Hindi name re-checked against official pages by a second agent; disagreements decided by a third.
  notes:
  - 'Writer: Active. The PMGKAY page says free grain continues for five years from 1 January 2024. By calculation that runs to the end of December 2028, but the page does not state an end date. One section of the NFSA implementation page still describes free grain only for one year from 1 January 2023; the newer PMGKAY page replaces that. The PMGKAY that ran during COVID (April 2020 to December 2022) gave an extra 5 kg per person on top of the normal ration. That extra grain has ended; today''s PMGKAY makes the normal NFSA ration free. Coverage figures differ by date: about 81.35 crore is the maximum (Census 2011), 80.67 crore were covered as on 31.10.2024 (implementation page) and the FAQ gives 80.48 crore. Priority-household criteria, documents, how to apply and any extra items or top-ups are decided by each state, so answers on these must point to the state''s food department. Chandigarh, Puducherry and part of Dadra & Nagar Haveli pay the food subsidy as cash into bank accounts (DBT)
    instead of giving grain. The Act also gives pregnant women and lactating mothers a maternity benefit of not less than Rs 6,000. It is delivered through a separate central scheme, not through the ration card, so it is not listed as a benefit here.'
  - No independent check was returned for this scheme.
