review:
  status: verified
  checked_on: '2026-10-03'
  method: Written from official pages by one research agent; every fact, rule number and Hindi name re-checked against official pages by a second agent; disagreements decided by a third.
  notes:
  - 'Writer: Rules here follow the PMFBY Operational Guidelines 2023, effective from Kharif 2023. The Department of Agriculture''s major-schemes page (dated 06-07-2026) still lists PMFBY, so it appears to be running, but I could not open an official notice confirming the approved scheme period beyond 2025-26 or any rule changes for Kharif 2026 (for example, new localized covers announced later). Notified crops, cut-off dates, sum insured and actual premium in rupees differ by State, district and season. Some States pay part or all of the farmer''s premium; the farmer may then pay only a token amount of at least Re 1. The optional add-on for crop loss from wild animal attack, where a State offers it, gets no central subsidy and its premium is paid by the farmer unless the State helps. The KRPH helpline number was not shown on the pages I could open.'
  - 'Checker: names_hi is empty, but agriwelfare.gov.in/en/Major shows the official Hindi name प्रधानमंत्री फसल बीमा योजना.'
  - 'Checker: The status note is out of date. The PIB backgrounder of 29 Aug 2026 (PRID 2304549) says 25 States/UTs are running PMFBY in Kharif 2026, Rs 12,200 crore is allocated in the 2026-27 budget, and Bihar joins from Rabi 2026-27. A Department of Expenditure OM dated 6 Apr 2026 (posted on the AIF portal circulars page) temporarily extended PMFBY to 30.09.2026 or until 16th Finance Commission approval, whichever is earlier. I did not see a PMFBY-specific notice for after 30.09.2026, but the portal pmfby.gov.in was live and updated on 01 Oct 2026.'
  - 'Checker: The status note says the KRPH helpline number was not found. It is 14447, shown on the pmfby.gov.in home page, in the guidelines and in the PIB release. how_to_apply should name the Crop Insurance App and KRPH 14447 as the first channels instead of ''the insurance company''s toll-free number''.'
  - 'Checker: Post-harvest cover is missing its peril limit. It applies only to hailstorm, cyclone, cyclonic rain and unseasonal rain, for crops kept in cut-and-spread condition in the field.'
  - 'Checker: The exclusion for late enrolment also covers post-harvest loss claims (para 21.6.10.8) and applies when the farmer''s data was not uploaded to NCIP. The record mentions only localized calamities.'
  - 'Checker: Not mentioned: the Centre''s subsidy share is capped at an actuarial rate of 25% (irrigated) or 30% (rainfed).'
  - 'Checker: The basic cover list should say ''wide-spread'' pest and disease attack. The guidelines cover these risks on an area basis, not for a single farm.'
  - 'Checker: I could not confirm whether any rule changes for Kharif 2026 exist, such as a change to wild-animal cover. The statement that the wild-animal add-on gets no central subsidy matches the 2023 guidelines (para 5.2.5) only.'
  - 'Checker: All cited sources are official.'
  - Official Hindi name added from https://agriwelfare.gov.in/en/Major.
