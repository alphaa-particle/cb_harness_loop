review:
  status: verified
  checked_on: '2026-10-03'
  method: Written from official pages by one research agent; every fact, rule number and Hindi name re-checked against official pages by a second agent; disagreements decided by a third.
  notes:
  - 'Writer: Uncertain whether new enrolments are still actively taken. The official Maandhan portal (footer updated 14/08/2026) still describes the scheme and its enrolment, exit and FAQ pages. However, the Ministry of Labour''s redesigned ''Schemes and Services'' list (checked 2026-10-03) shows PM-SYM but not NPS-Traders, and the old labour.gov.in/nps-traders page no longer shows any content. Before relying on it, check at a CSC or on helpline 14434. This scheme is different from the PFRDA-run National Pension System (NPS); its pension is managed and paid by LIC. The turnover limit (Rs 1.5 crore) is a limit on business turnover, not income, so it is not stored as an income rule. The portal FAQ gives the notification as S.O. 2615(E) dated 22.02.2019, which may be a typo; the date was not checked. The alias ''Pradhan Mantri Laghu Vyapari Maan-dhan'' was the name proposed for the scheme before launch.'
  - Whether the scheme is still open to new applicants was not clear.
  - 'Checker: Status unclear, and this matters most for this scheme. The Maandhan portal (footer last updated 14/08/2026) still lists NPS-Traders in its Schemes menu and has its scheme page and FAQ. But the Ministry of Labour''s current ''Schemes and Services'' page (labour.gov.in/offerings, checked 2026-10-03) lists PM Shram Yogi Maan-dhan and not NPS-Traders, and the Ministry''s schemes archive does not list it either. I found no official notice saying the scheme was closed or merged. The chatbot should tell users to confirm at a CSC or on 14434 before relying on it.'
  - 'Checker: Notification date: the FAQ says the scheme was notified by S.O. 2615(E) dated 22.02.2019. That is earlier than the scheme''s 2019 launch, so it may be a typo. I did not check the Gazette, and the record should not state the date as fact.'
  - 'Checker: The alias ''Pradhan Mantri Laghu Vyapari Maan-dhan Yojana'' / ''PM-LVM'' does not appear on any official page I opened. The status_note says it was the pre-launch name, and I could not check that.'
  - 'Checker: Exclusions vary between official pages. The FAQ lists income tax payers, members of government-funded NPS, ESIC, EPFO, and PM-SYM members. The scheme page adds PM-KMY. The record''s list is the union of both, which is fine, but the source for PM-KMY is the scheme page, not the FAQ.'
  - 'Checker: The ''Documents'' list (Aadhaar, bank account with IFSC, self-declaration) is a fair reading of the scheme page and FAQ. No official NPS-Traders page I opened gives a separate documents list.'
