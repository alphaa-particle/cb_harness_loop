review:
  status: verified
  checked_on: '2026-10-03'
  method: Written from official pages by one research agent; every fact, rule number and Hindi name re-checked against official pages by a second agent; disagreements decided by a third.
  notes:
  - 'Writer: The scheme is running: the PMMVY portal showed payment figures up to 31-08-2026. It is part of Mission Shakti, whose guidelines cover 2021-22 to 2025-26. I could not open an official page confirming the scheme period after March 2026. Official wording differs in two places. (1) For the first instalment, the Mission Shakti guidelines and the WCD page require at least one ante-natal check-up within 6 months of the last period, but the portal FAQ says at least two check-ups, ''preferably'' within six months. (2) The guidelines PDF says to apply within 730 days of pregnancy (counted from the last period), while the WCD page and FAQ say within 270 days of birth. The Rs 8 lakh income test is only one of several qualifying groups, not an overall ceiling, so no income rule is set. The minimum age is 18 years 7 months, so age_min is left out rather than rounded. The guidelines say any Janani Suraksha Yojana money for an institutional delivery is paid on top, so that a woman gets about
    Rs 6,000 on average. Some states run their own extra maternity schemes.'
  - 'Checker: The two official sources disagree on the first-instalment condition: the WCD page and guidelines say at least one ANC within 6 months of the LMP, the portal FAQ says at least two ANCs, preferably within 6 months. The record''s benefit text states only the ''one ANC'' version as fact. The chatbot should mention the difference or tell users to check with the Anganwadi worker.'
  - 'Checker: The age wording differs at the boundary: the WCD page says 18 years 7 months to 55 years, the FAQ says less than 55 years. The record''s fact text (''no older than 55'') follows the WCD page.'
  - 'Checker: Hindi name: the official logo uses ''प्रधानमंत्री'' as one word. Add ''प्रधानमंत्री मातृ वंदना योजना'' as a variant.'
  - 'Checker: The alias ''Pradhan Mantri Matritva Vandana Yojana'' does not appear on any official page I opened, so it is not an official name. It may still help matching but should not be shown as the scheme name.'
  - 'Checker: The guidelines also list ''any other category as may be prescribed by the Central Government'' as an eligibility group. The record leaves this out (minor).'
  - 'Checker: All sources are official (wcd.gov.in, pmmvy.wcd.gov.in). I found no text copied from the sources. Scheme status: the portal showed data updated 31-08-2026 (4.39 crore beneficiaries paid). No official page I could open confirms the approved scheme period after 2025-26.'
  - Hindi name not confirmed on an official page; kept only as a search alias.
