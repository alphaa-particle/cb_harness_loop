review:
  status: verified
  checked_on: '2026-10-03'
  method: Written from official pages by one research agent; every fact, rule number and Hindi name re-checked against official pages by a second agent; disagreements decided by a third.
  notes:
  - 'Writer: Loan limit under MISS: the official pages I could open give the subsidised loan limit as Rs 3 lakh. These are the DA&FW Annual Report 2024-25 and the DAHD leaflet uploaded in January 2026. The Union Budget 2025-26 announced raising the MISS limit to Rs 5 lakh for KCC loans, but I could not open an official page confirming this has taken effect (indiabudget.gov.in and pib.gov.in were blocked). Users should check the current limit with their bank. MISS is approved by the Government year by year, so its continuation for the current year should also be checked. The collateral-free limit was raised from Rs 1.6 lakh to Rs 2 lakh from 1 January 2025. The 2018 RBI master circular still shows older figures (Rs 1 lakh) and calls crop insurance compulsory, so insurance and collateral details there are out of date. In November 2025 the RBI merged its instructions into new Master Directions; their PDFs were behind a CAPTCHA, so the 2018 master circular was the latest full KCC text I could
    read. Banks may set their own age limits, documents and processing fees. The 15-day issue time and the fee waiver up to Rs 3 lakh are stated officially only for the livestock and fisheries (AHDF) KCC.'
  - 'Checker: card_validity fact is wrong as worded. RBI leaves the card''s validity to the bank; only the credit limit is fixed for 5 years. Reword it to: ''the KCC limit is sanctioned for 5 years, rising 10% a year; banks set the card''s validity and review''. Also drop ''RuPay'' as a fixed rule.'
  - 'Checker: Still open: KCC itself is a standing bank product and open. The interest benefit (MISS) is approved one financial year at a time. The latest official approval I saw is for FY 2025-26 (DA&FW letter of 16 June 2025). The DA&FW Credit page, updated 11-07-2026, lists no FY 2026-27 guideline. The 7%/4% figures for 2026-27 are therefore not confirmed. The FY 2025-26 letter also kept the limit at Rs 3 lakh even after the Budget 2025-26 promise of Rs 5 lakh.'
  - 'Checker: Missing condition: the interest benefit applies only for lenders covered by MISS: PSBs, private banks (rural and semi-urban branches only), SFBs, RRBs, cooperative banks and computerised PACS. A loan from a private bank''s urban branch would not get the 7% rate under MISS.'
  - 'Checker: Missing condition: the 3% prompt repayment incentive is lost if the loan is repaid more than one year after it was taken (MISS 2025-26).'
  - 'Checker: The status_note says the 15-day issue time and the Rs 3 lakh fee waiver are official only for the AHDF KCC. That is not accurate. The AHDF SoP cites an IBA advisory (04.02.2019) waiving processing, documentation, inspection, ledger folio and other service charges on all KCC and crop loans up to Rs 3 lakh. It also asks banks to issue KCCs to PM-KISAN beneficiaries within two weeks.'
  - 'Checker: Collateral nuance: the AHDF SoP and the RBI master circular allow collateral-free limits up to Rs 3 lakh where there is a tie-up arrangement, such as a milk union. The AHDF SoP still shows the old Rs 1.6 lakh base figure.'
  - 'Checker: The One Farmer-One KCC rule is now formal. The MISS 2025-26 letter makes banks take an undertaking that the applicant has no other KCC, and it denies the interest benefit on duplicate accounts. This backs the record''s exclusion, which could say so.'
  - 'Checker: The PM-KISAN one-page KCC form (fw.pmkisan.gov.in/Documents/Kcc.pdf) exists and pulls KYC from the PM-KISAN account. It does not itself say the farmer must apply at the branch where PM-KISAN money is received, so that phrase goes slightly beyond the source.'
  - 'Checker: The 2018 RBI master circular is out of date on collateral (Rs 1 lakh) and on compulsory crop insurance. The record''s status_note already says so. I did not verify the November 2025 RBI Master Directions.'
  - Fact card_validity corrected from '5 years' to 'No fixed card validity is set by RBI. Each bank decides how long the card is valid and how often it is reviewed. What is fixed for 5 years is the KCC credit limit, which for most farmers is raised by 10% in each of years 2 to 5.' per https://www.rbi.org.in/Scripts/NotificationUser.aspx?Id=11325&Mode=0.
  - 'Statement corrected per https://www.rbi.org.in/Scripts/NotificationUser.aspx?Id=11325&Mode=0: Each bank decides how long the Kisan Credit Card stays valid and when it is reviewed. The credit limit itself is set for five years. The card is a smart card that also works as a debit card, and the bank may issue it as a RuPay or EMV chip card. Farmers can draw money at the bank branch, by cheque, at ATMs, through bank agents (business correspondents), on PoS machines at input dealers, and through mobile banking.'
  - 'Fact card_validity dropped: its value ''No fixed card validity is set by RBI. Each bank decides how long the card is valid and how often it is reviewed. What is fixed for 5 years is the KCC credit limit, which for most farmers is raised by 10% in each of years 2 to 5.'' is not stated in the scheme''s sections.'
