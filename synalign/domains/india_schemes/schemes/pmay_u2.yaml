review:
  status: needs_review
  checked_on: '2026-10-03'
  method: Written from official pages by one research agent; every fact, rule number and Hindi name re-checked against official pages by a second agent; disagreements decided by a third.
  notes:
  - 'Writer: The scheme is active. It runs for 5 years from 1 September 2024 (to about August 2029), and applications are open on the Unified Web Portal. The pmay-urban.gov.in site says the guidelines were ''updated 15 Apr 2025'', but the copy read here is dated September 2024. Later changes may exist. The Rs 2.5 lakh total for BLC/AHP was worked out from the guidelines'' funding table (Centre plus minimum State share). States can add more money, can redefine the EWS income limit with MoHUA approval, and can set a cut-off date by which you must have lived in the town. The older FAQ page on pmay-urban.gov.in still describes the original PMAY-U (CLSS, MIG-I/MIG-II income up to Rs 18 lakh). Those rules do not apply to PMAY-U 2.0, where the interest subsidy scheme (ISS) replaced CLSS.'
  - No independent check was returned for this scheme.
