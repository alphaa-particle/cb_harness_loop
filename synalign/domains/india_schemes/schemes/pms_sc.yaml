review:
  status: needs_review
  checked_on: '2026-10-03'
  method: Written from official pages by one research agent; every fact, rule number and Hindi name re-checked against official pages by a second agent; disagreements decided by a third.
  notes:
  - 'Writer: The March 2021 guidelines cover 2020-21 to 2025-26, with funding shared 60:40 between Centre and States (90:10 for North Eastern States). On 3 Oct 2026 the Department''s scheme page (last updated 28 Sept 2026) still listed these as the current guidelines, but I found no official order on continuing or changing the scheme after 2025-26. The academic allowance rates are those that applied from 2021-22. The guidelines link them to the Consumer Price Index for Industrial Workers, with yearly revision from April 2022, so current rates may be higher. States may also top up the allowance from their own funds. Fees are covered as fixed by each State''s fee committee. The portal, deadlines and process differ by State; the scheme is not listed under central schemes on NSP. The guidelines required higher education institutions to have NAAC/NBA accreditation to stay in the scheme from 2025-26. No official Hindi name was found on an official page; the Department site''s Hindi view is a machine
    translation.'
  - No independent check was returned for this scheme.
