review:
  status: needs_review
  checked_on: '2026-10-03'
  method: Written from official pages by one research agent; every fact, rule number and Hindi name re-checked against official pages by a second agent; disagreements decided by a third.
  notes:
  - 'Writer: The official pages give two different end dates for Phase II. The About page says 2020-21 to 2025-26, and the FAQ says 2020-21 to 2024-25. Whether the IHHL incentive is still being given after March 2026 could not be confirmed. The Rs 7,200 / Rs 4,800 split (and Rs 10,800 / Rs 1,200 for North-Eastern and special-category states) comes from the Phase I FAQ. The Phase II FAQ keeps the same 60:40 and 90:10 ratios and says the Centre pays 100% in the remaining UTs. The Phase II Operational Guidelines PDF was too large to open, so these were not confirmed: the full list of documents, and when and in how many instalments the Rs 12,000 is paid (it is usually after the toilet is built and checked). Who counts as BPL or as an eligible APL household is decided locally, and states may add their own money. No official Hindi name for the scheme was found on the official pages.'
  - No independent check was returned for this scheme.
