review:
  status: verified
  checked_on: '2026-10-03'
  method: Written from official pages by one research agent; every fact, rule number and Hindi name re-checked against official pages by a second agent; disagreements decided by a third.
  notes:
  - 'Writer: Current rules taken from the NSAP About Us page and the October 2014 guidelines: widows aged 40 and above, Rs 300 a month (40-79) and Rs 500 a month (80+). Conflicting older figures still appear on the same official portal: the home page and FAQ say widows aged 40-59, and the FAQ shows an older central rate of Rs 200 a month; the scheme started in 2009 for ages 40-64. Treat these as outdated. The amounts shown are only the central share; most states add their own top-up and some run their own widow pension with different rules, so the actual amount and process differ by state. The scheme is open and is run by state governments (often the social welfare or rural development department); central funding is capped by each state''s estimated BPL numbers, and states may cover extra beneficiaries from their own money. No official Hindi name was found on the pages used. The old nsap.nic.in address did not resolve; the portal is now at nsap.dord.gov.in.'
  - 'Checker: names_hi is empty, but an official Hindi name exists: इंदिरा गांधी राष्ट्रीय विधवा पेंशन योजना (MoRD Hindi office memo of 30.06.2011, and myScheme). The status note''s claim that no official Hindi name exists is wrong.'
  - 'Checker: how_to_apply leaves out the online route that myScheme lists: apply through the UMANG app or web.umang.gov.in by searching NSAP and choosing Apply Online. Application status can also be tracked on the NSAP portal or in UMANG.'
  - 'Checker: myScheme gives the age band as 40-79 and says from 80 the pension is Rs 500. The record''s ''40 or above'' with Rs 500 from 80 matches the 2014 guidelines and About Us. Note that the 2012 office memo states central eligibility as 40-79.'
  - 'Checker: Payment modes: myScheme says the pension can be received in a bank account, a post office account, by postal money order, or in cash. The record mentions only bank or post office accounts.'
  - 'Checker: An important practical point sits only in the status note, not in eligibility: central funding is capped per state (an April 2026 MoRD letter confirms allocation by ''State Cap''). An eligible widow may get only a state-funded pension, or be waitlisted, once the cap is reached.'
  - 'Checker: No copied text found. Sources are official (nsap.dord.gov.in).'
  - Official Hindi name added from https://nsap.dord.gov.in/Guidelines/hindi_wps.pdf.
