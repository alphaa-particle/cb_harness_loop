review:
  status: needs_review
  checked_on: '2026-10-03'
  method: Written from official pages by one research agent; every fact, rule number and Hindi name re-checked against official pages by a second agent; disagreements decided by a third.
  notes:
  - 'Writer: The Cabinet approved continuing the scheme from FY 2021-22 to FY 2025-26 with Rs 1,827 crore, and the revised guidelines (March 2022) apply from FY 2022-23. On 3 Oct 2026 NSP showed NMMSS open for AY 2026-27 (student applications from 1 June to 31 Oct 2026), but I found no official order extending the scheme beyond 2025-26. Each State/UT runs its own selection test, sets its own exam dates and applies its own reservation rules. The NSP FAQ says ''relaxable by 50% for SC/ST'' in one place, which appears to be a typo; the guidelines and the Department''s page say 5%. The Hindi name comes from the Department''s website in Hindi view, which may be machine-translated.'
  - No independent check was returned for this scheme.
