review:
  status: verified
  checked_on: '2026-10-03'
  method: Written from official pages by one research agent; every fact, rule number and Hindi name re-checked against official pages by a second agent; disagreements decided by a third.
  notes:
  - 'Writer: Current rules taken from the NSAP About Us page and the October 2014 guidelines: Rs 20,000 lump sum on death of a BPL household''s breadwinner aged 18 to 59 (the guidelines say older than 18 and younger than 60). Conflicting older figures still appear on the same official portal: the home page says breadwinners aged 18-64, and the FAQ says death before age 65 and an older amount of Rs 10,000. Treat these as outdated. The 2014 guidelines do not list a death certificate or a deadline for applying after the death, but states commonly set their own document list and time limits, so check with the local office. Some states add their own money or run a separate family benefit scheme. The scheme is open and run by state governments (often the social welfare or rural development department). No official Hindi name was found on the pages used; the Hindi questions use a descriptive translation plus the abbreviation NFBS.'
  - 'Checker: The documents list leaves out the death certificate of the deceased breadwinner. myScheme (official) lists the death certificate, proof of identity, proof of address, BPL or ration card, and Family ID/Member ID for the deceased. For the applicant it lists ID, address and age proof, Family/Member ID, an Aadhaar-seeded bank or post office account, and a passport photo. The status note''s point that the 2014 guidelines do not list a death certificate is true, but citizens will almost always need one.'
  - 'Checker: names_hi is empty, and the Hindi questions and alias use ''राष्ट्रीय पारिवारिक लाभ योजना / parivarik labh yojana''. The official Hindi name is राष्ट्रीय परिवार लाभ योजना (Rashtriya Parivar Labh Yojana), per MoRD Hindi guidelines 2002 and myScheme. Add it, and use it in the Hindi questions.'
  - 'Checker: Where to apply varies: myScheme''s NFBS page says forms are free from the District or Tehsil Social Welfare Officer (DSWO/TSWO) and are submitted there. The record says Gram Panchayat or Municipality, following the general NSAP guidelines. It should say the office varies by state.'
  - 'Checker: ''Main earner'' should be defined as in the 2012 office memo: the member, male or female, whose earnings make up a substantial part of household income. myScheme''s FAQ confirms a woman who earned more counts as the primary breadwinner.'
  - 'Checker: No copied text found. Sources are official.'
  - Official Hindi name added from https://nsap.dord.gov.in/Guidelines/nsap%20guidelines%20in%20hindi%202002.pdf.
