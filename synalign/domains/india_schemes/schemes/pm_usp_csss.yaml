review:
  status: needs_review
  checked_on: '2026-10-03'
  method: Written from official pages by one research agent; every fact, rule number and Hindi name re-checked against official pages by a second agent; disagreements decided by a third.
  notes:
  - 'Writer: The guidelines apply from academic year 2022-23 onwards, and the rates apply from FY 2022-23 (for AY 2021-22 the rate was Rs 10,000 a year). On 3 Oct 2026 the NSP scheme list showed PM-USP CSSS only for RENEWAL applications for AY 2026-27, with the student window shown as 1 June 2026 to 30 Sept 2026. The NSP home page announcement, however, said renewal applications close on 31 Oct 2026. Neither page showed a fresh-application window for 2026-27, so whether new students can apply this year is unconfirmed. Check NSP before advising a new applicant. Slots: up to 82,000 fresh scholarships a year, shared among state boards (with CBSE and CISCE shares) by each state''s population aged 18-25. 50% of slots are for girls, the stream ratio is 3:3:1 (Humanities:Science:Commerce), and central reservation applies (SC 15%, ST 7.5%, OBC 27%, plus 5% for students with benchmark disabilities). Conflict: the guidelines bar any other scholarship, but an NSP announcement says that from AY 2026-27
    a student may apply for one merit-based scheme plus welfare-based schemes. No official Hindi name was seen on an official page.'
  - No independent check was returned for this scheme.
