review:
  status: verified
  checked_on: '2026-10-03'
  method: Written from official pages by one research agent; every fact, rule number and Hindi name re-checked against official pages by a second agent; disagreements decided by a third.
  notes:
  - 'Writer: STATUS: An MSDE office memorandum dated 23 April 2026 says NAPS-2, which belongs to the 15th Finance Commission period, formally ended on 31 March 2026. It was continued on the same terms up to 30 September 2026, or until PM-NAPS 3.0 is approved, whichever comes first. The PM-NAPS 3.0 proposal was before the Expenditure Finance Committee. Today (3 October 2026) is after that date, and I found no official notice of PM-NAPS 3.0 approval or a further extension. The apprenticeship portal still shows live openings, but the DBT support terms may change. STIPEND: the minimum stipend rates come from the Apprenticeship (Amendment) Rules, 2025, in force from 11 September 2025, after the Central Apprenticeship Council recommended a roughly 36% rise from the old Rs 5,000 to Rs 9,000 range. These are statutory minimums under the Apprentices Act and apply to apprentices generally, not only under NAPS. The same rules cap a person at two apprenticeships, limit the Central Government stipend
    share to the first apprenticeship, and set a minimum gap between trainings. That gap is 3 months when a contract ends for reasons such as health, money or relocation, and there is no waiting period for women. The 14 to 35 age band comes from the Feb 2025 Cabinet release. Under the Act the minimum age is 14, or 18 for hazardous industries. The older portal FAQ describes NAPS-1 features: reimbursement of the stipend share to employers, and basic training cost support of up to Rs 7,500 for 500 hours. Under NAPS-2 the government share goes directly to the apprentice by DBT, and I could not confirm the basic training cost support for NAPS-2 (the NAPS-2 guidelines PDF would not render), so it is left out. Graduate and diploma apprentices in some trades fall under a separate scheme, NATS (Ministry of Education).'
  - Whether the scheme is still open to new applicants was not clear.
  - 'Checker: STATUS UNCLEAR: The OM ends NAPS-2''s interim continuation on 30.09.2026. The portal notices list on 3 Oct 2026 has OMs up to 28.07.2026 (optional-trade eligibility) and 13.07.2026, but no OM extending NAPS-2 past 30.09.2026 and no notice approving PM-NAPS 3.0. Apprenticeship openings are still posted (about 7.22 lakh active vacancies), and apprenticeship under the Act continues regardless. Whether the Rs 1,500 DBT support is still being paid for new contracts after 30 Sep 2026 cannot be confirmed.'
  - 'Checker: Missing condition: under the Apprenticeship Rules (portal FAQ, rule 11 sub-rule 1AAAA), fresher apprentices in basic training are paid only 50% of the prescribed stipend for up to 3 months. The record presents the minimum stipend without this.'
  - 'Checker: Missing detail: the prescribed minimum stipend rises by 10% in the second year and a further 15% in the third year (rule 11, confirmed in the 2025 Gazette annexure).'
  - 'Checker: Missing condition: the government''s 25% share is paid by DBT only if the scheme conditions are met. Otherwise the establishment must pay the full stipend (note in the 2025 Gazette contract form).'
  - 'Checker: rules.age_max=35 could wrongly tell people over 35 they cannot be apprentices at all. The Act sets no upper age; 35 is the NAPS support band.'
  - 'Checker: Several sources are amazonaws.com (naps-cdn) URLs. They are linked from the official apprenticeshipindia.gov.in notices list, so they are acceptable, but they are not gov.in domains.'
  - 'Checker: Jan Vishwas (Amendment of Provisions) Act, 2026 amendments to the Apprentices Act took effect on 22 June 2026 (S.O. 3185(E)). I did not check what they change. They do not appear to affect the stipend or age figures.'
