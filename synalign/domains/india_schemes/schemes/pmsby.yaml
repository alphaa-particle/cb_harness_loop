review:
  status: verified
  checked_on: '2026-10-03'
  method: Written from official pages by one research agent; every fact, rule number and Hindi name re-checked against official pages by a second agent; disagreements decided by a third.
  notes:
  - 'Writer: The scheme is running and open to new members. A 23 April 2026 PIB backgrounder confirms the Rs 20 premium, the 18-70 age range and the Rs 2 lakh / Rs 1 lakh cover, and reports 57.11 crore enrolments as of February 2026. DFS showed 50.15 crore as of 28 February 2025. Some older material shows a lower premium; that is outdated. The scheme portal jansuraksha.gov.in failed its certificate check, so the official rules PDF and an official Hindi name could not be checked, and names_hi is left empty. The DFS FAQ does not list KYC or Aadhaar rules or other ways to enrol, such as net banking. This is a different cover from the RuPay card accident insurance that comes with a Jan Dhan account. The termination age is counted as age nearest birthday.'
  - 'Checker: The summary line ''Rs 1 lakh for partial disability'' can mislead. Only the listed losses are covered: sight of one eye, or use of one hand or foot. The DFS FAQ says no benefit is paid for other partial disability. Both disability benefit lines should use the official wording (''loss of sight'', ''loss of use'').'
  - 'Checker: The record does not say who provides the cover. The DFS page names public sector general insurers and other approved general insurers working with banks.'
  - 'Checker: names_hi is empty, but the Hindi questions use a Hindi name. No official Hindi name was verified.'
