review:
  status: needs_review
  checked_on: '2026-10-03'
  method: Written from official pages by one research agent; every fact, rule number and Hindi name re-checked against official pages by a second agent; disagreements decided by a third.
  notes:
  - 'Writer: The AIF portal says the scheme runs from 2020-21 to 2032-33, with loans to be disbursed within six years from 2020-21 (that is, up to 2025-26), and a fund size of Rs 1 lakh crore. Search results from February 2026 pointed to a Prime Minister''s announcement doubling the loan target to Rs 2 lakh crore, possibly with a changed timeline, but I could not open that official page (pmindia.gov.in returned 403), so it is not confirmed here. Check agriinfra.dac.gov.in or a bank for whether new loans are still being sanctioned in 2026-27. The 25-project limit does not apply to State agencies, cooperative federations or FPO federations. The 9% lending-rate cap is taken from the portal FAQ; several cooperative banks list lower rates. Loans can be larger than Rs 2 crore, but only the first Rs 2 crore gets the subvention.'
  - Whether the scheme is still open to new applicants was not clear.
  - 'Checker: The status note misses the most important current fact. A DA&FW Office Memorandum dated 30 Sep 2026 (AIF portal circulars, ''AIF Temporary Extension letter_30.09.2026'') extends AIF to 31.03.2027 or 16th FC approval, whichever is earlier. It also says no fresh approval or sanction is permitted from the 15th FC outlay and that only committed liabilities may be paid. New loan sanctions may therefore be paused from 1 Oct 2026, so still_open is unclear. The chatbot should not tell users new AIF loans are available without checking with the portal or a bank.'
  - 'Checker: Before this, sanctions were active in mid-2026. The NLMC minutes of 9 Jul 2026 describe a campaign from 19 Jun to 20 Jul 2026 to sanction loans, with more than two lakh projects sanctioned.'
  - 'Checker: The status note mentions an unverified ''Rs 2 lakh crore'' announcement. Remove it or mark it clearly as unconfirmed.'
  - 'Checker: The 25-project exemption in the status note is narrower than the September 2024 guidelines, which also exempt cooperatives, FPOs and SHGs.'
  - 'Checker: Credit guarantee details are incomplete: FPOs can use NABSanrakshan, and PACS warehouse loans have had 2+8 year cover since 24.09.2025. ''Without collateral'' was not seen on an official page.'
  - 'Checker: The 9% cap comes only from the FAQ. The guidelines leave the cap to lender agreements.'
  - 'Checker: The Aadhaar-OTP registration step in how_to_apply was not checked.'
  - 'Checker: The sources are official, but most items cite the AIF portal FAQ. The guidelines PDF is the stronger source.'
  - 'Statement not confirmed: Prime Minister''s announcement doubling the loan target to Rs 2 lakh crore (No such figure appears in the AIF circulars I checked, the PIB releases I opened (PRID 2222807, 2227847) or the NLMC minutes of 9 Jul 2026. Leave it out of the record.)'
