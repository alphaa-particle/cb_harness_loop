review:
  status: verified
  checked_on: '2026-10-03'
  method: Written from official pages by one research agent; every fact, rule number and Hindi name re-checked against official pages by a second agent; disagreements decided by a third.
  notes:
  - 'Writer: The scheme is open for jobs that start between 1 August 2025 and 31 July 2027, so it is still running on 2026-10-03. The official guidelines PDF (PMVBRY-Final.pdf) could not be read because of a font-encoding problem. As a result, the exact split of Rs 15,000 between the two instalments is not stated here. The official FAQ says the lock-in period for the second instalment''s savings or deposit account will be set in future guidelines. The Part B employer incentive is described on the portal as ''up to Rs 3,000'' per month; the slab amounts by wage band were not checked. The aliases ''Employment Linked Incentive (ELI) scheme'' and ''pehli naukri yojana 15000'' are commonly used names and were not confirmed on the pages used. The guidelines PDF only shows that the scheme is part of the PM''s Package for Employment and Skilling.'
  - 'Checker: How_to_apply presents face authentication as optional (''get a UAN through the employer, or generate it yourself using face authentication on UMANG''). Guidelines 3.1.5(ii) and 3.1.13 say the incentive is paid only if the UAN is authenticated with Face Authentication Technology on the UMANG app, and new UANs from 1 Aug 2025 must be made that way. The FAQ says the employee must generate the UAN this way. This mandatory condition should be stated plainly.'
  - 'Checker: The incentive is one month''s EPF wage, meaning the wage on which PF is paid, not gross salary. For the Rs 25,000 salary example, answers must not suggest the person gets their full salary. The amount is capped at Rs 15,000 and may be lower than gross pay.'
  - 'Checker: Missing caveat: guidelines 13.3 say the scheme is fund-limited (total outlay Rs 99,446 crore), and no claims are created after the scheme period ends or funds run out, whichever comes first.'
  - 'Checker: Missing: guidelines para 14 say the incentives are taxable under the Income Tax Act unless an exemption order is issued.'
  - 'Checker: The status_note is out of date. The guidelines PDF text can be extracted, and both the guidelines and the SOP give the split: 1st instalment up to Rs 7,500, 2nd is the balance up to Rs 15,000 in total. The ''ELI'' alias is official: the portal home page says ''Employment Linked Incentive (ELI) Scheme'', and the guidelines introduction says the Budget 2024-25 ''Employment Linked Incentives Scheme'' was named PMVBRY.'
  - 'Checker: The alias ''pehli naukri yojana 15000'' is not an official name. Keep it only as a search alias, never as the scheme''s name.'
  - 'Checker: Exclusions say leaving between 6 and 12 months loses the second instalment. The SOP adds that a First Timer who leaves and joins another employer is no longer a First Timer, so the incentive does not carry over to the new job.'
