review:
  status: verified
  checked_on: '2026-10-03'
  method: Written from official pages by one research agent; every fact, rule number and Hindi name re-checked against official pages by a second agent; disagreements decided by a third.
  notes:
  - 'Writer: RVY started on 1 April 2017 and was first paid for from the Senior Citizens'' Welfare Fund. The Department of Social Justice''s AVYAY page now lists it as a component of Atal Vayo Abhyuday Yojana, a central sector scheme, and ALIMCO runs it. I could not open the full RVY/AVYAY guidelines (para 9 eligibility), the myScheme page or PIB, so eligibility comes from ALIMCO''s RVY page. ALIMCO''s Hindi homepage words the income rule a little differently: it describes BPL seniors with monthly income not above Rs 15,000. The English RVY page says a senior can qualify either as BPL or, if not BPL, with income up to Rs 15,000. The ''free of cost'' benefit is based on ALIMCO''s wording; the page does not give one clear sentence saying it. The exact device list may vary by camp.'
  - 'Checker: The benefits list includes ''orthotic or prosthetic appliances''. ALIMCO''s RVY device list does not have them. It lists walking sticks, elbow/axilla crutches, foldable walkers, tripods/tetrapods, hearing aids, dentures, spectacles, wheelchairs, commode wheelchairs, folding commode chairs, cushions, knee braces, spinal supports, cervical collars, LS belts and walker-rollators. Remove the orthotic/prosthetic item unless a guideline confirms it.'
  - 'Checker: ''Free of cost'' is not stated as a rule on ALIMCO''s RVY page. It is only implied, by the exclusion of devices already received free from Government and by beneficiary testimonials. I could not open the RVY/AVYAY guidelines (para 9) or PIB to confirm it. The summary''s word ''free'' rests on inference.'
  - 'Checker: ALIMCO''s English and Hindi pages word the income rule differently. English: BPL, OR non-BPL with income up to Rs 15,000. Hindi: BPL seniors with income up to Rs 15,000. The record follows the English page; the conflict should stay flagged.'
  - 'Checker: The facts and the toll-free number rest on one official page (alimco.in/RVY). The MSJE AVYAY page confirms only that RVY is a Central Sector component of AVYAY and that devices must meet BIS standards. It does not give the age or income figures.'
  - 'Checker: Status basis: the MSJE AVYAY page (last updated 28 September 2026) still lists RVY as a component, and ALIMCO describes camp and OPD modes in the present tense. No end date was found. I could not see the formal AVYAY approval period for 2026-27 onward, so ''yes'' rests on these current official listings, not on an approval order.'
  - 'Checker: Possibly missing route: the ARJUN portal is titled ''ADIP & RVY Joint Interface for Unique Nomination'', so online nomination for RVY may be possible. The page would not render for me to confirm.'
  - 'Checker: All sources are official (alimco.in, socialjustice.gov.in).'
