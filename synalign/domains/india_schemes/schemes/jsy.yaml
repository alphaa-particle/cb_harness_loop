review:
  status: verified
  checked_on: '2026-10-03'
  method: Written from official pages by one research agent; every fact, rule number and Hindi name re-checked against official pages by a second agent; disagreements decided by a third.
  notes:
  - 'Writer: Listed as an active scheme on the NHM website (launched 12 April 2005). The current NHM page gives the cash amounts and says HPS eligibility is BPL/SC/ST women delivering in government centres, with no age or birth-number limits mentioned. The older MoHFW Features and FAQ document (around 2009) limited HPS benefits to BPL women aged 19 and above and to 2 live births, and is the only source for the Rs 500 home-delivery rule; whether these older limits still apply was not confirmed. Check with the local ASHA/ANM. The two documents also differ on the HPS ASHA package (Rs 600 rural on the NHM page versus Rs 200 in the older document) and on whether all LPS women (not only BPL/SC/ST) are covered in accredited private hospitals. One FAQ answer lists 8 LPS states, while the main text lists 10. Uttaranchal and Orissa are now Uttarakhand and Odisha. Jammu and Kashmir is now a Union Territory, and how Ladakh is treated was not checked. The pages used do not say whether payment is now
    made by bank transfer or what Aadhaar/bank details are needed. States may add their own top-ups. JSY is separate from PMMVY and from JSSK (which covers free delivery services).'
  - 'Checker: The alias ''National Maternity Benefit Scheme'' is wrong. NMBS was the older scheme that JSY replaced from 2005-06 (old FAQ Q.1); its cash benefits were folded into JSY. Keeping it as an alias could send general maternity-benefit questions (which may be about PMMVY) to JSY. Remove it or mark it as the predecessor scheme.'
  - 'Checker: The payment-mode statement is outdated or not verified. ''Cash paid in full at the facility at delivery'' comes from the old 2006-2009 guidance. That document also says that in accredited private institutions only at least three-quarters must be paid at delivery. None of the pages I opened confirm how JSY is paid today (for example by DBT to a bank account). The chatbot should not promise cash in hand at the hospital.'
  - 'Checker: The eligibility section leaves out the possible HPS age-19 and 2-live-birth limits; they appear only in the status note. Someone in an HPS state having a third child could be told she qualifies when she might not. Add a caveat to the eligibility text itself.'
  - 'Checker: Internal inconsistency: eligibility bullet 1 says the woman must give birth in a health facility, but the benefits list a home-delivery payment.'
  - 'Checker: Missing from the old guidance: no ASHA package is paid for deliveries in accredited private institutions (para 4.5). The benefit is still paid if the baby is stillborn (FAQ Q.13), and if a child dies after the benefit was paid, the next birth is still covered (FAQ Q.12).'
  - 'Checker: The writer''s cited documents disagree on accredited private institutions in LPS. The old table (para 4.3) covers all women, while the NHM page and the old Note 1 say BPL/SC/ST only. The record follows the NHM page, which is the safer choice.'
  - 'Checker: names_hi is empty.'
  - 'Checker: No official page other than the two the writer cited could be opened to check the amounts independently. myScheme loaded no scheme content and india.gov.in returned 403. DBT Bharat''s central scheme list does show ''Janani suraksha yojana'' under MoHFW, which supports that the scheme is current.'
