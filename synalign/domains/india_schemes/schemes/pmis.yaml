review:
  status: verified
  checked_on: '2026-10-03'
  method: Written from official pages by one research agent; every fact, rule number and Hindi name re-checked against official pages by a second agent; disagreements decided by a third.
  notes:
  - 'Writer: STILL A PILOT: PMIS has not been rolled out as a full scheme. The MCA office memorandum of 12 March 2026 extended the pilot until December 2026 with a target of 1.10 lakh internships, and its third round was running in April to August 2026. Nothing official yet says what happens after December 2026. RULES CHANGED IN 2026: the March 2026 guidelines replaced the 2024-25 pilot terms. The age band moved from 21-24 to 18-25. The family income ceiling rose from Rs 8 lakh (FY 2023-24) to Rs 12 lakh (previous FY). Monthly support rose from Rs 5,000 (Rs 4,500 government plus Rs 500 company) to Rs 9,000 (Rs 8,100 plus Rs 900). Duration changed from 12 months to 6 or 9 months, and some postgraduate degrees (MA, M.Sc., M.Com, MCA, M.Tech) became eligible. Interns already in the earlier pilot keep their 12-month duration but get Rs 9,000 from March 2026. Final-year students were added on 22 April 2026 and need an NOC. The myScheme PMIS page still shows the old figures (21-24 years, Rs 5,000,
    Rs 8 lakh, 12 months); it was used only for the document list and registration steps. The 12 March 2026 guidelines still exclude MBA, MD, MS, MPhil and PhD holders, even though some unofficial sites say MBAs are now eligible. INCOME RULE: the Rs 12 lakh limit applies to each family member separately (self, parents, spouse), not to the combined household income. HINDI NAME: PIB''s Hindi release translates the scheme as ''प्रधानमंत्री प्रशिक्षण योजना''. People may also say ''पीएम इंटर्नशिप योजना'', but I did not see that form on an official page.'
  - 'Checker: names_hi is incomplete. MCA''s own Hindi FAQ (PMIS portal) uses ''प्रधानमंत्री इंटर्नशिप योजना'' / ''पीएम इंटर्नशिप योजना'', which is the name citizens will actually use. ''प्रधानमंत्री प्रशिक्षण योजना'' (PIB) literally means ''PM Training Scheme'' and could be confused with other training schemes. The status note''s claim that ''पीएम इंटर्नशिप योजना'' is not on any official page is wrong.'
  - 'Checker: Documents list includes ''Proof of age'' (taken from the stale myScheme page). The official FAQ says age is read from Aadhaar, and lists Aadhaar e-KYC, proof of educational qualifications and an online self-declaration of eligibility.'
  - 'Checker: Missing practical limits from the official FAQ: at most 3 active applications at a time; no application fee; each posting has its own application window.'
  - 'Checker: Insurance nuance: guidelines and FAQ say MCA provides PMJJBY/PMSBY-equivalent cover through group insurance. But a portal notice says Round II interns were paid Rs 456 to take PMJJBY/PMSBY themselves, and the amount would be deducted from the government share if they did not update their details by 15.05.2026. Cover arrangements may differ by round.'
  - 'Checker: Source 4 (PIB Research Unit, Oct 2024) and source 5 (myScheme) describe the outdated 2024-25 pilot terms (12 months, Rs 5,000, 21-24, Rs 8 lakh). Keeping them as sources risks the chatbot pulling outdated figures; label them clearly as superseded or drop them.'
  - 'Checker: The duration sentence (''at least half ... not in a classroom'') closely follows the guidelines wording. It is not verbatim, but it could be reworded more.'
  - 'Checker: After December 2026 the pilot''s future is unknown. This is correctly flagged in the record.'
  - 'Checker on the status note: MCA added them through an Addendum to the Guidelines dated 08.04.2026. PIB announced it on 22.04.2026.'
  - 'Checker on the status note: PIB of 22 Apr 2026 says the third round is underway with rolling postings. I saw no official end date of August 2026. The portal on 3 Oct 2026 still says companies post on an ongoing basis (about 2.85 lakh opportunities shown).'
