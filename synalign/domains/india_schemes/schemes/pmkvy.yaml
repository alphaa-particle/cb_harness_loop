review:
  status: verified
  checked_on: '2026-10-03'
  method: Written from official pages by one research agent; every fact, rule number and Hindi name re-checked against official pages by a second agent; disagreements decided by a third.
  notes:
  - 'Writer: STATUS: The Skill India Programme, which includes PMKVY 4.0, was approved by Cabinet for 2022-23 to 2025-26 (Rs 8,800 crore). An MSDE office memorandum dated 23 April 2026 records that the Department of Expenditure let MSDE schemes continue on their existing terms up to 30 September 2026, or until the Skill India Programme for the 16th Finance Commission cycle is approved, whichever comes first. As of 3 October 2026 the Skill India Digital Hub still lists PMKVY 4.0 batches and invites training proposals, but I found no official notice saying whether the scheme continues after 30 September 2026 or is being replaced by a new version. AGE BY COMPONENT: the Cabinet release gives 15 to 59 as the overall target group, and the 15 to 45 limit for Short-Term Training comes from myScheme. The official PMKVY 4.0 guidelines PDF (msde.gov.in) blocked automated access, so the RPL age band for 4.0 is not verified. myScheme''s RPL page still shows PMKVY 3.0 rules (age 18 to 45, a Rs 500 reward
    and Rs 2 lakh accident insurance), and its STT page lists 3.0-era extras (post-placement stipend, placement incentives). These are not confirmed for 4.0 and are left out. Under PMKVY 4.0, placement is no longer linked to the scheme, so there is no placement guarantee. myScheme also says candidates need 70% attendance to sit the assessment.'
  - Whether the scheme is still open to new applicants was not clear.
  - 'Checker: STATUS UNCLEAR: The interim extension ran only to 30 Sep 2026. On 3 Oct 2026 the SIDH PMKVY page (last modified 3 Oct 2026) still shows Show Interest / Upcoming Batches and about 145 batches. I found no official notice of a further extension or of approval of the 16th-FC Skill India Programme. My web-search budget ran out, so I could not rule out a later PIB or Cabinet release.'
  - 'Checker: The RPL age band for PMKVY 4.0 is unverified. The 4.0 guidelines PDF on SIDH is behind a download button, which I did not use. The record''s rules.age_max=59 sits beside an STT limit of 45, and the RPL limit is unknown (the 3.0 rule was 18-45). Chatbot answers about people aged 46-59 could therefore be wrong. Consider recording age limits per component.'
  - 'Checker: The STT age band (15-45), the Aadhaar-linked bank account requirement and the ''dropouts/unemployed'' targeting all come from a myScheme page that still carries PMKVY 3.0 text. They are plausible but not confirmed for 4.0.'
  - 'Checker: The Rs 5,000 PwD sentence closely follows the PIB wording (''assistive devices and aids''). It is not a verbatim copy, but it could be reworded more.'
  - 'Checker: The SIDH page still advertises Recruit-Train-Deploy and support ''to placement''. The status note''s ''no placement guarantee'' is consistent with PIB 2200373 (placements were not tracked under 4.0), but the record could say clearly that placement is not assured.'
  - 'Checker: Source 7 (the OM) is an amazonaws.com URL, not a gov.in domain. It is linked from the official apprenticeshipindia.gov.in notices list, so it is acceptable, but say so.'
