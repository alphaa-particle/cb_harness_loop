review:
  status: needs_review
  checked_on: '2026-10-03'
  method: Written from official pages by one research agent; every fact, rule number and Hindi name re-checked against official pages by a second agent; disagreements decided by a third.
  notes:
  - 'Writer: The scheme is active. A December 2024 Ministry letter says the target is 4.95 crore houses by March 2029, including 2 crore more houses approved by the Cabinet, with the beneficiary list updated through the Awaas+ 2024 survey under revised exclusion rules. The official sources disagree on the exclusion rules. The portal''s ''Am I Eligible'' checker (used here) uses a Rs 15,000 monthly income limit and no longer counts two-wheelers, fishing boats, fridges or landline phones. The 2022 Framework still lists 13 exclusions with a Rs 10,000 monthly income limit. The Rs 1.20 lakh and Rs 1.30 lakh amounts come from the 2022 Framework, and no official revision was found. Some states add their own money on top. It is not clear whether the Awaas+ 2024 self-survey is still open in October 2026. The MGNREGS wage support is written as ''90/95 person days'', and the About page shows a typo (''90.95''). The portal has moved from pmayg.nic.in to pmayg.dord.gov.in.'
  - No independent check was returned for this scheme.
