review:
  status: verified
  checked_on: '2026-10-03'
  method: Written from official pages by one research agent; every fact, rule number and Hindi name re-checked against official pages by a second agent; disagreements decided by a third.
  notes:
  - 'Writer: The scheme is open. The Government approved this expansion of AB PM-JAY on 11 September 2024, and card enrolment began in late October 2024 (the official SOPs are dated 30 October 2024). Enrolment stays open all year. ''Ayushman Vay Vandana'' is the name of the card for this group; it is part of AB PM-JAY, not a separate insurance policy. The Rs 5 lakh is one amount per family, shared by everyone in the family aged 70 or above; it is not Rs 5 lakh per person. The November 2024 guidelines listed 3 States that were not running PM-JAY. Which states take part may have changed since then and was not checked, so seniors in those states should ask their state health agency. The NHA guidelines and FAQ were read from the Madhya Pradesh State Health Agency website, because the central NHA, PM-JAY and PIB pages could not be loaded.'
  - 'Checker: State participation is a key condition, but it appears only in status_note and not in eligibility. Seniors in states or UTs that do not implement AB PM-JAY cannot get the card. The Nov 2024 guidelines show 3 such states, and the current list was not verified.'
  - 'Checker: The benefits section leaves out the two-way top-up. In an existing family, if the seniors use the original Rs 5 lakh wallet, the other members get a top-up of up to Rs 5 lakh (guidelines sec. 5.1).'
  - 'Checker: Self-registration in practice also needs a mobile number linked to Aadhaar for the OTP (MP SOP), or else fingerprint or iris authentication through an operator. The record''s ''Aadhaar is the only document'' is correct, but a user without an Aadhaar-linked mobile should be pointed to an operator or ASHA.'
  - 'Checker: All the central NHA material I could read was hosted on the MP State Health Agency site, because pmjay.gov.in refused the connection. It is official, but no central NHA or PIB page was opened.'
  - 'Checker: Still open: the guidelines say enrolment is continuous, and the MP SHA home page still lists 70+ coverage with card statistics dated July 2026.'
