review:
  status: needs_review
  checked_on: '2026-10-03'
  method: Written from official pages by one research agent; every fact, rule number and Hindi name re-checked against official pages by a second agent; disagreements decided by a third.
  notes:
  - 'Writer: Rules follow the Ministry of Tribal Affairs guidelines applicable from 1 April 2022 (final version dated March 2023). The Ministry site tribal.nic.in refused connections, so the guideline was read from the copy on the Gujarat Tribal Development Department site. A West Bengal rate chart dated 01.04.2025 lists the same Government of India stipend rates and the same Rs 2,50,000 income ceiling, so the rates do not appear to have changed. States and UTs run the scheme on their own portals or the National Scholarship Portal. Funding is 75:25 Centre:State (90:10 for North-East and hilly states, 100% central for UTs without a legislature). Application dates, fee caps and extra state top-ups differ by state; West Bengal, for example, adds its own top-up to hostel stipends. The West Bengal portal shows applications open for the 2026-27 session, so the scheme is running. No central page was found confirming a formal extension or rate revision after the 2021-26 cycle. Students at the Ministry''s
    listed top class institutes are covered by the separate National Fellowship and Scholarship for Higher Education of ST Students instead.'
  - No independent check was returned for this scheme.
