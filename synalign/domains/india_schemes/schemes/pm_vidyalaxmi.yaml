review:
  status: needs_review
  checked_on: '2026-10-03'
  method: Written from official pages by one research agent; every fact, rule number and Hindi name re-checked against official pages by a second agent; disagreements decided by a third.
  notes:
  - 'Writer: The Union Cabinet approved the scheme on 6 November 2024 as a Central Sector Scheme, and it is active. The portal FAQ says claims for loans disbursed in 2025-26 are processed after 31 March 2026. The list of eligible Quality Higher Educational Institutions is set by the Ministry of Education, but the pages read did not give the selection criteria (such as NIRF ranks) or the number of institutions. The Department of Higher Education page and PIB returned 403. The loan itself has no income limit; only the interest subvention does. The 3% subvention is capped at 1 lakh students a year. Full interest subvention for families earning up to Rs 4.5 lakh comes from the older PM-USP CSIS scheme, which is handled through the same portal. Interest rates differ by bank; the leaflet caps them at EBLR plus 0.5%. The official leaflet also describes a pilot that credits interest subvention to a PM Vidyalaxmi digital rupee (CBDC) wallet. No official page read said whether students already getting
    other government scholarships are barred from the subvention.'
  - No independent check was returned for this scheme.
