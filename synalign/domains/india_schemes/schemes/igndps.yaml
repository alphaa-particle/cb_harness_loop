review:
  status: needs_review
  checked_on: '2026-10-03'
  method: Written from official pages by one research agent; every fact, rule number and Hindi name re-checked against official pages by a second agent; disagreements decided by a third.
  notes:
  - 'Writer: Current rules taken from the NSAP About Us page and the October 2014 guidelines: age 18 and above, severe (80% or more) or multiple disabilities, Rs 300 a month (18-79) and Rs 500 a month (80+). Conflicting older figures still appear on the same official portal: the home page and FAQ say ages 18-59, and the FAQ shows an older central rate of Rs 200 a month; the scheme started in 2009 for ages 18-64. Treat these as outdated. The 2014 guidelines define severe and multiple disability using the older Persons with Disabilities Act 1995 and National Trust Act 1999; certificates are now issued under the Rights of Persons with Disabilities Act 2016, and states may apply the definitions differently. The amounts shown are only the central share; most states add a top-up or run their own disability pension with different rules and lower thresholds. The scheme is open and run by state governments; central funding is capped by each state''s estimated BPL numbers. No official Hindi name was
    found on the pages used; Hindi questions use a descriptive name plus the abbreviation IGNDPS.'
  - 'Checker: names_hi is empty, but the Ministry''s Hindi office memo (30.06.2011) calls the scheme इंदिरा गांधी राष्ट्रीय अपंगता पेंशन योजना, and myScheme Hindi uses इंदिरा गांधी राष्ट्रीय विकलांग पेंशन योजना. The Hindi questions use a third, unofficial form (विकलांगता). The status note''s claim that no official Hindi name exists is wrong.'
  - 'Checker: The ''multiple disabilities below 80% still qualify'' reading in exclusions is not stated plainly in any official source, and section 2.3 of the guidelines and myScheme stress 80%. Reword it as uncertain, or tell users to check with the state, so people with under 80% are not misled.'
  - 'Checker: ''Persons with dwarfism are also eligible'' is confirmed (section 2.3 and myScheme), but the record should make clear they still need to be 18+ and BPL.'
  - 'Checker: how_to_apply leaves out the online route through the UMANG app or web.umang.gov.in (NSAP, Apply Online) that myScheme lists, and status tracking on the NSAP portal.'
  - 'Checker: Documents: myScheme says the disability certificate (80% and more) is accepted from a Chief Medical Officer, Community Health Centre or Primary Health Centre. It also lists an Aadhaar card and passport-size photos. Worth adding.'
  - 'Checker: The central funding cap per state (confirmed in an April 2026 MoRD letter on FY 2026-27 allocation) appears only in the status note.'
  - 'Checker: No copied text found. Sources are official.'
  - Official Hindi name added from https://nsap.dord.gov.in/Guidelines/hindi_igndps.pdf.
  - 'Statement not confirmed: A certified disability below 80% does not meet the central scheme''s severity level, unless the person has multiple disabilities (This is the writer''s reading of the rules. Para 1.2.5 together with the About Us ''severe or multiple'' wording supports it. Section 2.3 says only that the level has to be 80%, and myScheme asks for a certificate of 80% and more. No official page says outright that multiple disabilities below 80% qualify.)'
