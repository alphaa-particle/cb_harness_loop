review:
  status: needs_review
  checked_on: '2026-10-03'
  method: Written from official pages by one research agent; every fact, rule number and Hindi name re-checked against official pages by a second agent; disagreements decided by a third.
  notes:
  - 'Writer: The scheme is open. pmjay.gov.in, nha.gov.in, PIB and myScheme pages could not be loaded, so the main facts come from NHA documents (2019, 2023, 2024) published on official state health agency websites. The national list of eligible families was widened in January 2022 to 12 crore families, and states have added more groups at their own cost. For example, Madhya Pradesh lists NFSA ration card holders, construction workers, ASHA and Anganwadi workers, and others. Which extra groups are covered therefore varies by state, and some states run the scheme together with their own state health scheme under a joint name. From late 2024, everyone aged 70 or above is covered regardless of income (see Ayushman Vay Vandana). The number of treatment packages changes when the package list is revised (2019 guidebook: more than 1,350; Madhya Pradesh now lists 1,952), so no package count is given as a fact. Groups added after 2024, and the current list of participating states, were not checked
    against official pages.'
  - 'Checker: The eligibility examples ''SC/ST households'', ''no adult male member aged 16 to 59'' and ''destitute families living on alms'' (auto-included) were not seen on any official page I opened. The 16-59 example probably needs the ''female-headed household'' condition.'
  - 'Checker: The eligibility line ''Every person aged 70 or above is covered'' leaves out two conditions: the Rs 5 lakh is shared per family, not per person, and it applies only where the state or UT implements AB PM-JAY (the Nov 2024 guidelines list 3 non-implementing states, unnamed). I did not verify which states have joined since.'
  - 'Checker: The helpline accept list includes 1800-111-565, which appears only in the 2019 guidebook. 14555 is the number confirmed in current official material.'
  - 'Checker: Aadhaar e-KYC exceptions: the NHA 2023 guideline lets someone who has applied for Aadhaar use the enrolment slip once, with a PM-JAY ID valid for only 30 days. The record''s ''except in some emergencies'' is vague.'
  - 'Checker: Which extra groups are covered (e.g., MP adds NFSA ration-card holders, BoCW workers, ASHA and Anganwadi workers) varies by state. The record says so, which is good.'
  - 'Checker: pmjay.gov.in refused the connection, so I checked the central facts against NHA documents hosted on state SHA sites and the MP and Uttarakhand SHA pages. All of these are official.'
  - 'Checker: Still open: the MP SHA site shows card statistics as of 23 July 2026 and empanelment orders dated August 2026.'
  - 'Statement not confirmed: ...families with no adult male member aged 16 to 59 (None of the official pages I opened lists the individual D-criteria. As commonly stated, this criterion (D3) applies to FEMALE-HEADED households with no adult male aged 16-59, so the record''s paraphrase may drop the ''female-headed'' condition. Check it against pmjay.gov.in.)'
