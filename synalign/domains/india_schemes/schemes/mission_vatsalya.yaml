review:
  status: verified
  checked_on: '2026-10-03'
  method: Written from official pages by one research agent; every fact, rule number and Hindi name re-checked against official pages by a second agent; disagreements decided by a third.
  notes:
  - 'Writer: The figures come from the Mission Vatsalya guidelines sent to states on 5 July 2022, which apply from 1 April 2022. The guidelines tie sponsorship to the Mission''s period and say it ''may be extended upto 2025-26''. I could not open an official page confirming that the scheme or new sponsorships continue after March 2026 (the Mission Vatsalya portal returned 403). Sponsorship is not automatic: it depends on the district committee recommending the case, the District Magistrate approving it, and budget being available. States may add money on top or run it under their own names. The income limits (Rs 72,000 rural, Rs 96,000 other areas) apply only to preventive sponsorship. No income limit is stated for children returning from children''s homes, so no income rule is set. The age limit applies to the child, not to the parent or guardian who asks, so no age rule is set. The same Rs 4,000 a month is the norm for foster care, and for after care for young people leaving homes (age
    18 to 21, can be extended to 23). Children under the PM CARES for Children Scheme also get Rs 4,000 a month for non-institutional care.'
  - Whether the scheme is still open to new applicants was not clear.
  - 'Checker: The eligibility criterion is changed: the guidelines cover parents who cannot care for the child ''both financially and physically'', but the record says ''either financially or physically''. That makes eligibility look wider than it is.'
  - 'Checker: The record says ''The DCPU or the child''s family can upload the request on the Mission Vatsalya portal''. In the guidelines, this step is described for a child who is in institutional care, not for every applicant.'
  - 'Checker: The documents section says the guidelines give no fixed list. It leaves out the Aadhaar rule: Gazette notification S.O. 1694(E) of 11 April 2023 (https://wcd.gov.in/images/uploaded/1709975712_karZuHgdn8.pdf) requires proof of Aadhaar, or an Aadhaar enrolment request plus other documents such as a birth certificate or school ID and proof of relationship to the guardian, for Mission Vatsalya benefits. It also says no child may be denied for lacking Aadhaar.'
  - 'Checker: The guidelines say the SFCAC reviews and sanctions sponsorship only for preventive cases. Rehabilitative cases go through the CWC/JJB before reaching the DCPU. The summary simplifies this to ''DCPU and a district committee recommend''.'
  - 'Checker: Continuation is not clear: the guidelines make sponsorship co-terminus with the Mission and extendable ''upto 2025-26''. The WCD page lists no 2026-27 document for Mission Vatsalya, and the Mission Vatsalya portal returned 403. I could not confirm that new sponsorships are being approved after March 2026.'
  - 'Checker: Sources are official (wcd.gov.in). I found no copied sentences. The eligibility list follows the guidelines'' order closely but is reworded.'
  - 'Statement to correct: ''Sponsorship lasts at least one year and can continue until the child turns 18''. The checker read "For government-aided sponsorship, the guidelines leave the length to the SFCAC case by case, make it co-terminus with Mission Vatsalya, and say it may be extended up to 2025-26; extension up to age 18 needs written reasons from the JJB/CWC/Children''s Court. The ''minimum one year'' wording appears only in the paragraph on private-aided sponsorship." on https://wcd.gov.in/documents/uploaded/1714390625_pDwvtjA0sD.pdf.'
  - '2026-10-03: the checker''s corrections above were applied to the statements; re-read the official page before relying on them.'
