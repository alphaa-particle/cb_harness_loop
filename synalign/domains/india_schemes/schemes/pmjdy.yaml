review:
  status: needs_review
  checked_on: '2026-10-03'
  method: Written from official pages by one research agent; every fact, rule number and Hindi name re-checked against official pages by a second agent; disagreements decided by a third.
  notes:
  - 'Writer: The scheme is running and open for new accounts. pmjdy.gov.in shows 59.37 crore beneficiaries. The Hindi scheme page on pmjdy.gov.in (and the 2014 brochure) still lists older terms: Rs 5,000 overdraft, Rs 1 lakh accident cover and a Rs 30,000 life cover. The 2018 continuation decision replaced these with a Rs 10,000 overdraft, Rs 2 lakh accident cover for accounts opened after 28 August 2018, and an overdraft age limit of 18-65 (earlier 18-60). The Rs 30,000 life cover is not among the current benefits on the English scheme page or in the 2024 PIB note, so it is left out. The 90-day card-use rule and the 90-day claim reporting rule come from the 2016-17 RuPay insurance FAQ hosted on pmjdy.gov.in, and current-year policy terms may differ. The 6-month satisfactory-operation rule for the overdraft comes from older official material. The 2018 decision says up to Rs 2,000 has no conditions, and banks decide eligibility for larger amounts. The official pages opened do not set a minimum
    age for opening the account itself; banks follow RBI rules for minors. pib.gov.in press-release pages returned 403, so PIB PDF backgrounders were used instead.'
  - 'Checker: The overdraft line uses an old rule. The 6-month satisfactory-operation condition comes from 2014 material for the old Rs 5,000 overdraft. The 2018 decision only says there are no conditions up to Rs 2,000. Reword it to say banks decide eligibility for amounts above Rs 2,000, or drop the 6-month claim.'
  - 'Checker: The RuPay claim rules are taken from a 2016-17 FAQ for the RuPay insurance programme in general, not a current PMJDY document. The record says the card itself must have been used, but under the FAQ any qualifying transaction through any channel or instrument counts. The record also leaves out the 60-day deadline for claim documents and the exception for accidents within 90 days of card issue. Label these as past terms that may have changed.'
  - 'Checker: Missing condition: the PIB 2024 note says cash withdrawals from a basic savings account are limited to four a month.'
  - 'Checker: The documents section leaves out a point from the official Hindi page: with Aadhaar, if the address has changed, a self-certified current address is enough.'
  - 'Checker: Source 6 lists NPCI as publisher, but the FAQ document does not name NPCI. It refers to The New India Assurance Co. as the insurer. Attribution should be corrected or marked as uncertain.'
  - 'Checker: Source 4 (the Hindi scheme page) and source 8 (the 2014 brochure) contain outdated benefit amounts: Rs 5,000 overdraft, Rs 1 lakh cover and Rs 30,000 life cover. Use them only for the Hindi name and history, never for current amounts.'
  - 'Checker: Eligibility line 1 follows the PIB 2024 sentence very closely (''Any Indian citizen eligible to open a regular bank account can open...''). Consider rewording it more freely.'
  - 'Checker: The 18-65 overdraft age range rests on one official document, the 2018 continuation note. No second official page confirms it.'
  - 'Statement not confirmed: for larger amounts the bank looks at how the account has been run, usually over 6 months (The 6-month rule appears only in the 2014 mission document and the outdated Hindi scheme page, where it applied to the original Rs 5,000 overdraft. No current official page links the 6-month rule to the Rs 10,000 overdraft, or to amounts above Rs 2,000.)'
