review:
  status: needs_review
  checked_on: '2026-10-03'
  method: Written from official pages by one research agent; every fact, rule number and Hindi name re-checked against official pages by a second agent; disagreements decided by a third.
  notes:
  - 'Writer: The scheme is running and open to new members. A 23 April 2026 PIB backgrounder confirms the Rs 436 premium, Rs 2 lakh cover and 18-50 entry age, and reports 26.88 crore enrolments as of February 2026. DFS showed 23.12 crore as of 28 February 2025. Some older material shows a lower premium; that is outdated. The scheme portal jansuraksha.gov.in failed its certificate check, so the official rules PDF and an official Hindi name could not be checked, and names_hi is left empty. The DFS FAQ does not list KYC or Aadhaar rules or other ways to enrol, such as net banking; banks may offer these. The termination age is counted as age nearest birthday.'
  - 'Checker: The how_to_apply line saying claims go through the bank or post office where the member is enrolled was not found on any DFS page that was opened. The FAQ only says LIC or another insurer handles claim settlement. The official rules on jansuraksha.gov.in could not be checked.'
  - 'Checker: The auto-debit date of 31 May is not stated on the DFS FAQ.'
  - 'Checker: names_hi is empty, but the Hindi questions use a Hindi name. Either add a verified official Hindi name or keep it empty and flag it for later.'
  - 'Checker: rule age_max=50 is an entry limit only. Members who joined before 50 stay covered to 55, so eligibility logic should not exclude them.'
  - 'Statement not confirmed: The premium is taken automatically each year on or before 31 May (The DFS FAQ only says ''on or before the due date'' and gives no date. 31 May is implied by the cover period but is not stated.)'
