review:
  status: verified
  checked_on: '2026-10-03'
  method: Written from official pages by one research agent; every fact, rule number and Hindi name re-checked against official pages by a second agent; disagreements decided by a third.
  notes:
  - 'Writer: Ongoing (started 1 April 2018). A Ministry press release dated 7 December 2024 (on the Central TB Division site) says monthly support was raised from Rs 500 to Rs 1,000 for all TB patients. However, the CTD FAQ page and the 2018 scheme document still say Rs 500. No official page I could open gave the exact start date of the Rs 1,000 rate or any revised instalment schedule. The instalment timing here is from the 2018 document. The same release mentions added energy boosters for TB patients and food support for household contacts under PM TB Mukt Bharat Abhiyaan (Ni-kshay Mitra), which are separate initiatives; details were not checked. Funding follows NHM centre-state cost sharing. Some states give food in kind instead of cash. No official Hindi name was found on the pages opened.'
  - 'Checker: Conflicting official text: the CTD FAQ page (tbcindia.mohfw.gov.in/faqs/) still says Rs 500 a month. If the corpus retrieves that page, users will get the old amount, so it should be excluded or labelled as outdated.'
  - 'Checker: The date the Rs 1,000 rate took effect was not found on any official page I opened.'
  - 'Checker: Missing related benefits in the 2026 CTD campaign document: every TB patient''s BMI is checked, and patients with BMI below 18.5 get energy-dense nutritional supplements for the first 2 months. Payments can go to a post office account as well as a bank account. Ni-kshay Mitra food baskets (18 kg a month) now also reach household contacts. These are related to NPY but are separate from the cash payment.'
  - 'Checker: DBT Bharat also lists a separate cash scheme, ''NIKSHAY - Tribal TB Patients'', under MoHFW. I did not check its details, but a tribal patient asking about TB money support might be eligible for it as well.'
  - 'Checker: The extension amounts in the 2018 schedule (Rs 1,000 for a two-month extension, or Rs 500 for one month) are at the old rate and should not be quoted as current.'
  - 'Checker: Minor: the eligibility line ''all notified TB patients are beneficiaries'' is almost word for word from the 2018 document. It is short and factual, but it could be reworded.'
  - 'Checker: ''No age or income limit'' is a fair reading of ''all notified TB patients'', but the source does not say it in so many words.'
