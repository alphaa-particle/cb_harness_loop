review:
  status: verified
  checked_on: '2026-10-03'
  method: Written from official pages by one research agent; every fact, rule number and Hindi name re-checked against official pages by a second agent; disagreements decided by a third.
  notes:
  - 'Writer: Ongoing under the National Health Mission (launched 1 June 2011). The original 2011 guidelines covered sick newborns only up to 30 days after birth; the current NHM page says sick newborns and infants up to one year, and that care for complications before and after delivery was added in 2014. The 48-hour drop-back detail comes from the 2011 guidelines; the NHM page just says free drop back home. Free transport is run by each state (ambulance numbers and arrangements differ). Only government or public facilities are covered. JSSK gives free services, not cash; the cash incentive for institutional delivery is under JSY.'
  - 'Checker: names_hi is empty.'
  - 'Checker: The free tests named (blood, urine, ultrasound) and the grievance system (help desks, complaint boxes, displayed contact details, fixed hearing hours) come from the 2011 guidelines and are confirmed there. The guidelines do not set a timeframe for resolving complaints.'
  - 'Checker: The 48-hour drop-back appears only in the 2011 guidelines. The current NHM page just says free drop-back home.'
  - 'Checker: The current pages do not say how long after delivery a ''postnatal complication'' is covered. The 2011 guidelines describe free drugs and tests up to 6 weeks after delivery; the record leaves this out.'
  - 'Checker: DBT Bharat''s central scheme list still shows ''Janani Shishu Suraksha Karyakram'' (in kind) under MoHFW, which supports that the scheme is still running. I saw no explicit statement dated 2025-26.'
