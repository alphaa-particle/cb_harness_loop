review:
  status: verified
  checked_on: '2026-10-03'
  method: Written from official pages by one research agent; every fact, rule number and Hindi name re-checked against official pages by a second agent; disagreements decided by a third.
  notes:
  - 'Writer: The 2022 guidelines say PMEGP was approved for five years, 2021-22 to 2025-26 (the 15th Finance Commission cycle). That period ended on 31 March 2026. I could not confirm whether the scheme has been extended or changed from 2026-27: the PMEGP e-portal (kviconline.gov.in) did not resolve, PIB was blocked, and the KVIC home page showed no newer circular. Before advising anyone, check with KVIC, the State KVIB or the District Industries Centre that applications are open. All amounts and rates are from the 2022 guidelines and may have been revised since. The guidelines say ''above 18 years''; this record uses 18 as the minimum age. No official Hindi name was found on the pages opened.'
  - Whether the scheme is still open to new applicants was not clear.
  - 'Checker: ''Apply online only; paper applications are not accepted'' conflicts with the current Ministry of MSME PMEGP page. That page says people may also apply offline by giving physical forms to implementing agencies, and that forms are available in regional languages.'
  - 'Checker: The collateral-free limit is out of date: it is now Rs 20 lakh, not Rs 10 lakh (see item).'
  - 'Checker: Status: I found no official document extending PMEGP beyond 31 Mar 2026. Official sources still describe it as operating, though. A Lok Sabha reply (PIB, 30 Jul 2026) lists current PMEGP measures, a PIB release of 7 Sep 2026 describes it in the present tense, the Ministry of MSME site still lists it, and KVIC reported 66,494 units for FY 2025-26. The PMEGP e-portal (kviconline.gov.in) would not resolve, so I could not confirm that applications are open. Check with KVIC, KVIB or DIC.'
  - 'Checker: Interest is the bank''s normal rate. PIB (2 Feb 2026) confirms banks set it under RBI rules, which matches the record.'
  - 'Checker: An official Hindi name exists (see names_hi) but the record has none.'
  - Official Hindi name added from https://master-msme.digifootprint.gov.in/static/uploads/2025/06/3cbeb4bf6e6dbb3ce07e7473a85d480a.pdf.
  - 'Statement to correct: ''Banks do not ask for collateral on loans up to Rs 10 lakh''. The checker read ''Rs 20 lakh'' on https://www.pib.gov.in/PressReleasePage.aspx?PRID=2291936&reg=3&lang=1.'
  - '2026-10-03: the checker''s corrections above were applied to the statements; re-read the official page before relying on them.'
