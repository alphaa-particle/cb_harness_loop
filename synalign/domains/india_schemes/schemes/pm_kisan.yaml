review:
  status: verified
  checked_on: '2026-10-03'
  method: Written from official pages by one research agent; every fact, rule number and Hindi name re-checked against official pages by a second agent; disagreements decided by a third.
  notes:
  - 'Writer: The scheme is running and open: the 23rd instalment was released on 20 June 2026, and the amount is still Rs 6,000 a year (the Union Budget 2026-27 set aside Rs 60,000 crore). The 2020 guidelines fix 01.02.2019 as the land-ownership cut-off date, except for inheritance, ''for the next 5 years''. That period has passed, and I could not find an official page saying whether the cut-off was changed, so people who got land after that date should check with the state agriculture department. Non-official reports say a Farmer ID (AgriStack) is now required for new registrations in many states; I could not confirm this on an official page. The original 2018-19 note and the first FAQ give a 2-hectare limit; the revised 2020 guidelines cover all landholding families. The 2026 PIB backgrounder calls PM-KISAN ''centrally sponsored'', but the guidelines call it a Central Sector Scheme fully funded by the Centre. pmkisan.gov.in failed certificate checks, so documents were read from the fw.pmkisan.gov.in
    mirror. The revised FAQ there is a scanned image and was not used. Some states add their own payments on top of PM-KISAN; those are not covered here.'
  - 'Checker: Missing condition: the Annual Report 2024-25 (section 10.2) says FRA patta holders and PVTG farmers can register without the usual land record, and their e-KYC requirement has been relaxed for now. The record states land records and e-KYC as absolute rules, which may wrongly turn away forest-rights holders.'
  - 'Checker: How to apply is incomplete. The Annual Report 2024-25 also lets farmers enrol through the local Patwari, Revenue Officer or the State Nodal Officer (PM-Kisan), not only the portal, app or CSC.'
  - 'Checker: The cut-off rule in the guidelines (para 5.2) was set for the next 5 years from 2019. The original note says only the Cabinet can change it within those 5 years. That period is over, and I found no official page with a newer rule. The eligibility text states the 01.02.2019 rule as if it still applies without question; it should carry the caveat that is now only in status_note.'
  - 'Checker: The 2026 PIB backgrounder calls PM-KISAN ''centrally sponsored'', which contradicts the guidelines, the original note and the Annual Report (Central Sector, 100% GoI). The record rightly relies on the guidelines.'
  - 'Checker: The Farmer ID (AgriStack) requirement is not confirmed on any official page I could open. The PIB 2026 backgrounder mentions AgriStack only for West Bengal services and does not make it a registration condition. Keep it out of the record as written.'
  - 'Checker: The ''district grievance committee'' wording is a loose summary. The guidelines (para 7.2) set up State and District Level Grievance Redressal Monitoring Committees. The PIB 2026 backgrounder confirms the portal and CPGRAMS routes.'
  - 'Checker: I could not confirm whether the 24th instalment had been paid by 2026-10-03. The scheme is clearly running: 23rd instalment on 20 June 2026, and a Budget 2026-27 allocation of Rs 60,000 crore.'
