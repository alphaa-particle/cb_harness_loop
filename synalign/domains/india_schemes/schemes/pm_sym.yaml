review:
  status: verified
  checked_on: '2026-10-03'
  method: Written from official pages by one research agent; every fact, rule number and Hindi name re-checked against official pages by a second agent; disagreements decided by a third.
  notes:
  - 'Writer: Open for enrolment: the official Maandhan portal (footer updated 14/08/2026) and the Ministry of Labour website''s scheme list both still show it. Small wording difference on income: the scheme page says monthly income of Rs 15,000 or below, while one portal FAQ says less than Rs 15,000. The exclusion for people getting another government pension appears in the March 2025 PIB note but not on the Maandhan scheme page. If a member later joins EPFO (organised sector), the portal FAQ says they may stay in the scheme but the government share stops and they must pay that share too, or they can withdraw with interest. The old labour.gov.in/pm-sym page no longer shows content after the ministry''s website was redesigned. Pension money is managed and paid by LIC.'
  - 'Checker: Missing benefit: the PIB note says permanent disability caused by an accident before 60 is handled like death. The spouse can continue, or the contribution is paid back with the higher of fund or savings-bank interest.'
  - 'Checker: Missing: the rule for missed payments. The PIB note says a member can regularise by paying all dues plus any penalty the government decides, and that the revival window for dormant accounts was extended from 1 to 3 years.'
  - 'Checker: The interest paid on a refund after death before 60 differs between the official FAQ (savings-bank rate) and the PIB note (higher of fund or savings-bank rate). If the record gives a rate, it should name both sources.'
  - 'Checker: The 10-year exit rules are sourced only from the PIB note, not from the Maandhan PM-SYM pages the record cites. The PIB note should be cited for that statement.'
  - 'Checker: The exclusion for people already getting another government pension appears only in the PIB note, not on the Maandhan scheme page or FAQ (the writer noted this).'
  - 'Checker: Still open: the Maandhan portal (footer last updated 14/08/2026) and the Ministry of Labour ''Schemes and Services'' page (checked 2026-10-03) both list PM Shram Yogi Maan-dhan.'
