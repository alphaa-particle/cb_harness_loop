review:
  status: verified
  checked_on: '2026-10-03'
  method: Written from official pages by one research agent; every fact, rule number and Hindi name re-checked against official pages by a second agent; disagreements decided by a third.
  notes:
  - 'Writer: Official pages disagree on the upper age limit. The e-Shram objectives page and the August 2026 PIB backgrounder say ''16 years and above'' with no upper limit. The e-Shram FAQ and the December 2024 PIB note say 16 to 59 years. Because of this, age_max is left out. The income-tax-payer exclusion comes from the August 2026 PIB backgrounder; the e-Shram FAQ says only that there is no income criterion. The August 2026 PIB lists only Aadhaar and a mobile number as required, while older official pages also ask for a bank account with IFSC. e-Shram is a registration, not a cash scheme. Registering alone does not pay money or give automatic insurance: PMSBY and PMJJBY need enrolment and yearly premiums (Rs 20 and Rs 436, as shown on the e-Shram schemes page). Do not promise free insurance, even though some older material describes free cover for new registrants. Registration was open as of August 2026, with 31.89 crore workers registered. The Hindi name ''ई-श्रम पोर्टल'' was seen in
    official PIB Hindi press-release titles, but those pages were not opened.'
  - 'Checker: Benefits section suggests every registrant can join PMSBY, PMJJBY and PM-SYM, but leaves out their own limits: PMSBY ages 18-70, PMJJBY 18-50, both needing an Aadhaar-linked savings or Jan Dhan account with auto-debit; PM-SYM entry age 18-40 and monthly income below Rs 15,000. A 16- or 17-year-old registrant could be misled (beta.eshram.gov.in/social-security-welfare-schemes).'
  - 'Checker: Official pages disagree on the upper age limit. FAQ Q-30 and the PIB note of Dec 2024 say 16-59; the objectives page and the PIB backgrounder of Aug 2026 say 16 and above. The record notes this only in status_note, so answers for workers aged 60+ should carry a visible caution.'
  - 'Checker: The documents list shows a bank account with IFSC as required. FAQ Q-31 and the PIB backgrounder of Aug 2026 list only Aadhaar and mobile number; the 2021 leaflet and the PIB note of Dec 2024 also ask for a bank account. Better to say the bank account may be asked for.'
  - 'Checker: The FAQ asks for a mobile number linked with Aadhaar. The official leaflet says a worker without one can register at a CSC using biometric authentication. That tip is missing from how_to_apply.'
  - 'Checker: The official 2021 leaflet still says registering gives Rs 2 lakh PMSBY accident cover. The record is right to avoid promising free cover, but the corpus should keep this warning.'
  - 'Checker: The Hindi name was not confirmed on any official page.'
