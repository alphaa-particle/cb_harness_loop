review:
  status: verified
  checked_on: '2026-10-03'
  method: Written from official pages by one research agent; every fact, rule number and Hindi name re-checked against official pages by a second agent; disagreements decided by a third.
  notes:
  - 'Writer: Conflicting official wording on earlier loans: the portal eligibility text bars anyone who took a PMEGP, PM SVANidhi or MUDRA loan in the past 5 years, while the portal FAQ says people who have fully repaid a PM SVANidhi or MUDRA loan can apply (PMEGP borrowers cannot). Applicants should confirm at a CSC or DIC. The home page calls the toolkit benefit a Rs 15,000 grant; the FAQ says up to Rs 15,000. The pages opened did not state the scheme''s end date or whether new registrations are open today; the full guidelines PDF was too large to open and PIB was blocked, so check the portal before advising. No official Hindi name was found on the pages opened. The verification step (Gram Pradhan/urban local body, then district) is taken from the official login roles listed on the portal.'
  - Whether the scheme is still open to new applicants was not clear.
  - 'Checker: How to apply is misleading. The PIB Backgrounder (16 Sep 2026) says applications can be made only through Common Service Centres (CSCs). The record tells people to register on the portal themselves.'
  - 'Checker: Missing loan condition: only people who have completed Basic Training can get the first loan tranche (PIB Backgrounder).'
  - 'Checker: Registration status is missing. The portal shows the target of 30,00,000 registrations was ''already achieved in September 2025''. PIB (16 and 18 Sep 2026) confirms 30 lakh registered. West Bengal joined only in May 2026 and has received over 7 lakh applications. I found no official statement on whether new registrations are open in other states, so the chatbot should not promise that registration is open.'
  - 'Checker: The status_note says the end date could not be found. PIB gives an outlay of Rs 13,000 crore for FY 2023-24 to FY 2027-28, so the scheme period is known.'
  - 'Checker: The status_note reports a ''conflict'' about earlier loans. PIB resolves it: borrowers who have fully repaid a MUDRA or SVANidhi loan are eligible. Portal FAQ #24 says PMEGP borrowers cannot apply.'
  - 'Checker: Verification has three tiers: Gram Panchayat or urban local body, then the District Implementation Committee, then approval by a Screening Committee. The record leaves out the Screening Committee approval step.'
  - 'Checker: Official Hindi names exist (see names_hi), but the record has none.'
  - Official Hindi name added from https://www.pib.gov.in/PressReleasePage.aspx?PRID=2311858&reg=48&lang=2.
